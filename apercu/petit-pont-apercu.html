rienter des ballons qui arrivent \xE0 des hauteurs diff\xE9rentes.",durationMin:6,reps:"5 s\xE9ries, 45 secondes de pause",equipment:["ballon"],space:"petit",parentRole:"aucun",intensity:2,bodyAreas:["pied","cheville","hanche"],steps:["Deux jongles du pied pour stabiliser.","Faire monter le ballon \xE0 hauteur de hanche.","Un contact de la cuisse, \xE0 plat.","Reprendre du pied. R\xE9p\xE9ter la s\xE9quence."],mistakes:["Cuisse inclin\xE9e : le ballon part devant.","Ballon trop haut."],corrections:["\xAB Cuisse \xE0 l'horizontale, comme une table. \xBB","\xAB Hauteur de hanche maximum. \xBB"],easy:"Pied, pied, cuisse, rattraper.",medium:"S\xE9quence pied-cuisse-pied sans rattraper, 3 fois.",hard:"Ajouter la t\xEAte ou alterner les deux cuisses.",success:"3 s\xE9quences compl\xE8tes encha\xEEn\xE9es.",diagram:{kind:"juggle",caption:"Pied \xB7 cuisse \xB7 pied"},metricKey:"jongles"},{slug:"le-ballon-colle",name:"Le ballon coll\xE9",category:"controle",age:[5,8],level:"debutant",difficulty:1,objective:"Arr\xEAter un ballon qui roule avec la semelle ou l'int\xE9rieur du pied.",skill:"Contr\xF4le au sol",why:"Un ballon bien arr\xEAt\xE9, c'est un ballon qu'on peut rejouer. C'est le geste le plus utilis\xE9 dans un match.",durationMin:5,reps:"10 ballons par pied",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:["pied","cheville"],steps:["Placez-vous \xE0 3 m\xE8tres de lui.","Faites rouler le ballon doucement vers lui, \xE0 la main.","Il l'arr\xEAte : le ballon doit rester \xAB coll\xE9 \xBB \xE0 son pied.","Il vous le renvoie comme il veut."],mistakes:["Il attend le ballon talons au sol.","Pied dur : le ballon rebondit loin."],corrections:["\xAB Sautille comme un boxeur avant que le ballon arrive. \xBB","\xAB Ton pied est un coussin : il recule un peu quand le ballon arrive. \xBB"],easy:"Ballon roul\xE9 \xE0 la main, lentement.",medium:"Ballon pass\xE9 au pied.",hard:"Annoncez \xAB droit \xBB ou \xAB gauche \xBB pendant que le ballo "],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:["pied","hanche"],steps:["Lancez le ballon \xE0 la main, en cloche, depuis 4 m\xE8tres.","Il amortit avec la surface annonc\xE9e.","Le ballon doit retomber devant lui, \xE0 un pas.","Il vous le renvoie d'une passe au sol."],mistakes:["Surface raide : le ballon rebondit.","Il recule au lieu d'aller vers le ballon."],corrections:["\xAB Accompagne le ballon vers le bas, comme si tu attrapais un \u0153uf. \xBB","\xAB Fais un pas vers lui. \xBB"],easy:"Cuisse seulement, lancers bas.",medium:"Pied et cuisse, lancers en cloche.",hard:"Amorti puis contr\xF4le orient\xE9 vers un plot annonc\xE9.",success:"6 amortis sur 8 retombent \xE0 moins d'un pas.",diagram:{kind:"pair",caption:"J'accompagne le ballon"},metricKey:"controle"},{slug:"controle-sous-pression",name:"Contr\xF4le et sortie rapide",category:"controle",age:[12,17],level:"confirme",difficulty:4,objective:"Contr\xF4ler et sortir de la zone avant l'arriv\xE9e d'un d\xE9fenseur passif.",skill:"Contr\xF4le sous pression",why:"\xC0 partir de 12 ans, le temps disponible diminue. Il faut savoir o\xF9 aller avant m\xEAme de recevoir.",durationMin:7,reps:"2 s\xE9ries de 6 ballons, 1 minute de pause",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:3,bodyAreas:C,steps:["Tracez un carr\xE9 de 4 \xD7 4 m\xE8tres. L'enfant est au centre.","Passez-lui le ballon puis avancez vers lui en marchant.","Il doit contr\xF4ler et sortir du carr\xE9 par un c\xF4t\xE9 libre avant que vous arriviez.","Variez votre course pour fermer un c\xF4t\xE9 diff\xE9rent."],mistakes:["Il ne regarde pas avant de recevoir.","Contr\xF4le vers le d\xE9fenseur."],corrections:["\xAB Un coup d'\u0153il par-dessus l'\xE9paule pendant que le ballon roule. \xBB","\xAB Va du c\xF4t\xE9 o\xF9 je ne suis pas. \xBB"],easy:"Le parent reste immobile et montre un c\xF4t\xE9 interdit.",medium:"Le parent avance en marchant.",hard:"Le parent avance en trottinant ; sortie en deux touches maximum.",success:"5 sorties r\xE9ussies sur 6.",diagram:{kind:"square",caption:"Je regarde avant, je sors du bon c\xF4t\xE9"},metricKey:"controle"},{slug:"passe-a-papa-maman",name:"La passe au sol",category:"passes",age:[5,8],level:"debutant",difficulty:1,objective:"Faire une passe au sol avec l'int\xE9rieur du pied.",skill:"Passe courte",why:"La passe est le premier geste du jeu \xE0 plusieurs. L'int\xE9rieur du pied est la surface la plus pr\xE9cise.",durationMin:5,reps:"20 passes",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:["pied","cheville","hanche"],steps:["Placez-vous face \xE0 face, \xE0 3 m\xE8tres.","Il pose son pied d'appui \xE0 c\xF4t\xE9 du ballon.","Il frappe avec l'int\xE9rieur du pied, comme avec une crosse de hockey.","Vous lui renvoyez doucement : il arr\xEAte, puis repasse."],mistakes:["Frappe de la pointe.","Pied d'appui loin du ballon.","Ballon qui d\xE9colle."],corrections:["Montrez la \xAB joue \xBB du pied et touchez-la avec le ballon.","\xAB Ton pied d'appui est le copain du ballon : juste \xE0 c\xF4t\xE9. \xBB","\xAB Frappe au milieu du ballon, pas en dessous. \xBB"],easy:"\xC0 2 m\xE8tres, ballon arr\xEAt\xE9.",medium:"\xC0 4 m\xE8tres, deux touches.",hard:"\xC0 5 m\xE8tres, en alternant les pieds.",success:"7 passes sur 10 arrivent dans vos pieds.",diagram:{kind:"pair",caption:"Int\xE9rieur du pied, pied d'appui \xE0 c\xF4t\xE9"},metricKey:"passes",isFree:!0},{slug:"passes-dans-la-porte",name:"Les passes dans la porte",category:"passes",age:[7,12],level:"debutant",difficulty:2,objective:"Passer avec pr\xE9cision \xE0 travers une porte de plots.",skill:"Pr\xE9cision de passe",why:"Une porte donne une cible claire : l'enfant voit tout de suite si sa passe est pr\xE9cise.",durationMin:6,reps:"3 s\xE9ries de 10 passes",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:1,bodyAreas:["pied","cheville","hanche"],steps:["Posez une porte de 1 m\xE8tre entre vous deux.","Placez-vous chacun \x les (portes de plots) num\xE9rot\xE9es \xE0 8 \xE0 12 m\xE8tres.","L'enfant conduit le ballon sur 2 m\xE8tres.","Vous annoncez un num\xE9ro.","Il passe ou frappe vers la bonne cible."],mistakes:["Il s'arr\xEAte pour viser.","Il choisit toujours la plus facile."],corrections:["\xAB Encha\xEEne sans stopper le ballon. \xBB","Annoncez le num\xE9ro plus t\xF4t, puis de plus en plus tard."],easy:"Ballon arr\xEAt\xE9, cibles larges.",medium:"Ballon en mouvement.",hard:"Annonce au dernier moment, pied impos\xE9.",success:"5 cibles atteintes sur 8.",diagram:{kind:"target",n:3,caption:"J'\xE9coute, je vise, je joue"},metricKey:"passes"},{slug:"tir-dans-le-but-geant",name:"Le but g\xE9ant",category:"finition",age:[4,7],level:"debutant",difficulty:1,objective:"Tirer dans un grand but et marquer souvent.",skill:"Premi\xE8re frappe",why:"Marquer est la plus grande joie du football. Un but large garantit la r\xE9ussite et donne envie de recommencer.",durationMin:5,reps:"10 \xE0 15 tirs",equipment:["ballon","but"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:["pied","cheville","genou"],safety:k.tir,steps:["Fabriquez un but de 3 \xE0 4 m\xE8tres avec deux rep\xE8res.","Il pose son ballon \xE0 3 m\xE8tres et tire.","F\xEAtez chaque but avec lui (inventez votre c\xE9l\xE9bration !).","Vous pouvez faire un gardien tr\xE8s gentil qui plonge du mauvais c\xF4t\xE9."],mistakes:["Il tire de la pointe.","Il court tr\xE8s loin pour prendre son \xE9lan."],corrections:["\xAB Tire avec les lacets ou l'int\xE9rieur. \xBB","\xAB Deux pas d'\xE9lan suffisent. \xBB"],easy:"But tr\xE8s large, ballon arr\xEAt\xE9.",medium:"Il conduit le ballon puis tire.",hard:"But r\xE9duit \xE0 2 m\xE8tres, tir du pied faible.",success:"Il marque et il a envie de recommencer.",diagram:{kind:"target",n:0,caption:"Je tire, je marque, je f\xEAte !"},metricKey:"frappes",isFree:!0},{slug:"conduite-et-frappe",name:"Conduite puis frappe",category:"finition",age:[7,12],level:"debutant",difficulty:2,objective:"Encha\xEEner une conduite de balle et une frappe cadr\xE9e.",skill:"Encha\xEEnement conduite-frappe",why:"On tire rarement ballon arr\xEAt\xE9. Cet encha\xEEnement est la situation la plus fr\xE9quente devant le but.",durationMin:7,reps:"2 s\xE9ries de 6 frappes, pause de 1 minute",equipment:["ballon","but","plots"],space:"grand",parentRole:"joue",intensity:2,bodyAreas:C,safety:k.tir,steps:["Posez un plot \xE0 10 m\xE8tres du but et un autre \xE0 6 m\xE8tres.","Il part du premier plot, conduit jusqu'au second.","Il frappe avant de d\xE9passer le second plot.","Il r\xE9cup\xE8re son ballon en marchant : c'est son temps de repos."],mistakes:["Derni\xE8re touche trop longue ou trop courte.","Il regarde le sol au moment de frapper.","Corps en arri\xE8re : le ballon monte."],corrections:["\xAB Ta derni\xE8re touche pr\xE9pare ton tir : un pas devant toi. \xBB","\xAB Un coup d'\u0153il au but avant de frapper. \xBB","\xAB Penche-toi au-dessus du ballon. \xBB"],easy:"En marchant, frappe de l'int\xE9rieur.",medium:"En trottinant, frappe du cou-de-pied.",hard:"Frappe dans un c\xF4t\xE9 annonc\xE9, puis du pied faible.",success:"4 frappes cadr\xE9es sur 6.",diagram:{kind:"target",n:0,caption:"Derni\xE8re touche, coup d'\u0153il, frappe"},metricKey:"frappes"},{slug:"frappe-apres-passe",name:"Frappe sur une passe",category:"finition",age:[10,17],level:"intermediaire",difficulty:3,objective:"Frapper en une ou deux touches un ballon qui arrive.",skill:"Finition sur ballon en mouvement",why:"Les occasions de but viennent souvent d'une passe. Il faut savoir frapper un ballon qui roule.",durationMin:8,reps:"3 s\xE9ries de 5 frappes, 1 minute de pause",equipment:["ballon","but"],space:"grand",parentRole:"joue",intensity:3,bodyAreas:C,safety:k.tir,steps:["L'enfant se place \xE0 10 \xE0 12 m\xE8tres du but.","Vous lui passez le ballon depuis le c\xF4t\xE9.","Il contr\xF4le vers l'avant puis frappe.","Alternez les c\xF4t\xE9s : passe de la droite, puis de la gauche."],mistakes:["Contr\xF4le sous lui : il ne peut plus frapper.","Il veut frapper trop fort.","Pied d'appui trop loin."],corrections:["\xAB Contr\xF4le vers le but, d'un pas. \xBB","\xAB Cadrer d'abord, la puissance viendra. \xBB","\xAB Pied d'appui \xE0 c\xF4t\xE9 du ballon, point\xE9 vers la cible. \xBB"],easy:"Deux touches, passes lentes.",medium:"Deux touches, c\xF4t\xE9s altern\xE9s.",hard:"Une touche, zone du but annonc\xE9e.",success:"3 frappes cadr\xE9es sur 5 dans chaque s\xE9rie.",recoverySec:60,diagram:{kind:"target",n:0,caption:"Contr\xF4le vers l'avant, puis frappe"},metricKey:"frappes"},{slug:"passe-le-gardien-du-tresor",name:"Le gardien du tr\xE9sor",category:"dribbles",age:[5,9],level:"debutant",difficulty:2,objective:"Passer un adversaire gentil pour atteindre une zone.",skill:"Oser le duel",why:"Dribbler, c'est d'abord oser. Un d\xE9fenseur bienveillant permet de r\xE9ussir et de prendre confiance.",durationMin:6,reps:"8 passages",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:C,safety:k.duo,steps:["Tracez une ligne \xAB tr\xE9sor \xBB derri\xE8re vous.","Vous \xEAtes le gardien : vous ne bougez que sur les c\xF4t\xE9s, sur votre ligne.","Il part \xE0 6 m\xE8tres et doit atteindre le tr\xE9sor ballon au pied.","Laissez-le r\xE9ussir souvent : 2 fois sur 3 au moins."],mistakes:["Il fonce droit sur vous.","Il s'arr\xEAte devant vous."],corrections:["\xAB Fais-moi croire que tu vas d'un c\xF4t\xE9, et pars de l'autre. \xBB","\xAB Arrive lentement, puis acc\xE9l\xE8re pour passer. \xBB"],easy:"Le gardien est une statue.",medium:"Le gardien se d\xE9place en marchant sur sa ligne.",hard:"Le gardien peut avancer d'un pas.",success:"5 passages r\xE9ussis sur 8, et le sourire.",diagram:{kind:"mirror",caption:"Je feinte d'un c\xF4t\xE9, je pars de l'autre"},metricKey:"dribbles"},{slug:"le-crochet",name:"Le crochet",category:"dribbles",age:[8,13],level:"intermediaire",difficulty:3,objective:"Changer brusquement de direction avec l'int\xE9rieur ou l'ext\xE9rieur du pied.",skill:"Crochet int\xE9rieur et ext\xE9rieur",why:"Le crochet est le dribble le plus simple et le plus efficace : il sert \xE0 tous les postes.",durationMin:6,reps:"3 s\xE9ries de 6 passages",equipment:["ballon","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:C,steps:["Posez un plot \xAB d\xE9fenseur \xBB \xE0 5 m\xE8tres.","Il avance vers le plot en conduite.","\xC0 un m\xE8tre, il coupe le ballon d'un geste sec de l'int\xE9rieur du pied.","Il acc\xE9l\xE8re sur 3 m\xE8tres apr\xE8s le crochet."],mistakes:["Crochet fait trop pr\xE8s ou trop loin du plot.","Pas d'acc\xE9l\xE9ration ensuite.","Corps droit, sans feinte."],corrections:["\xAB \xC0 un grand pas du plot. \xBB","\xAB Apr\xE8s le crochet : trois pas rapides. \xBB","\xAB Penche ton \xE9paule du c\xF4t\xE9 o\xF9 tu ne vas pas. \xBB"],easy:"En marchant, crochet int\xE9rieur.",medium:"En trottinant, int\xE9rieur puis ext\xE9rieur.",hard:"Deux plots d\xE9cal\xE9s : crochet int\xE9rieur puis ext\xE9rieur encha\xEEn\xE9s.",success:"5 crochets sur 6 nets, suivis d'une acc\xE9l\xE9ration.",diagram:{kind:"zigzag",n:3,caption:"Feinte, crochet, acc\xE9l\xE9ration"},metricKey:"dribbles"},{slug:"passement-de-jambes",name:"Le passement de jambes",category:"dribbles",age:[10,17],level:"intermediaire",difficulty:4,objective:"Faire passer le pied autour du ballon pour tromper, puis partir de l'autre c\xF4t\xE9.",skill:"Feinte de corps",why:"Le passement de jambes apprend \xE0 dissocier le haut et le bas du corps : c'est une feinte, pas un num\xE9ro de cirque.",durationMin:7,reps:"3 s\xE9ries de 6 passages",equipment:["ballon","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:[...C,"hanche"],steps:["D'abord sans vitesse : ballon arr\xEAt\xE9, le pied droit tourne autour du ballon par l'int\xE9rieur.","Il pose ce pied, puis pousse le ballon avec l'ext\xE9rieur de l'autre pied.","Ensuite en avan\xE7ant doucement vers un plot.","Enfin, acc\xE9l\xE9ration sur 3 m\xE8tres apr\xE8s la feinte."],mistakes:["Le pied passe loin du ballon.","Aucun changement de rythme.","Geste fait trop pr\xE8s du d\xE9fenseur."],corrections:["\xAB Ton pied fr\xF4le le ballon. \xBB","\xAB Lent avant, rapide apr\xE8s. \xBB","\xAB D\xE9clenche \xE0 deux pas du plot. \xBB"],easy:"Sur place, ballon arr\xEAt\xE9.",medium:"En marchant vers un plot.",hard:"Double passement, ou face \xE0 un parent en d\xE9fense passive.",success:"4 feintes fluides sur 6, suivies d'une acc\xE9l\xE9ration.",diagram:{kind:"zigzag",n:2,caption:"Lent avant, rapide apr\xE8s"},metricKey:"dribbles"},{slug:"un-contre-un-portes",name:"Un contre un aux deux portes",category:"dribbles",age:[11,17],level:"confirme",difficulty:4,objective:"Choisir et atteindre une des deux portes face \xE0 un d\xE9fenseur.",skill:"Dribble et d\xE9cision",why:"Avoir deux solutions oblige \xE0 lire le d\xE9fenseur : c'est exactement la situation d'un match.",durationMin:8,reps:"8 duels, 30 secondes de pause entre chacun",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:3,bodyAreas:C,safety:k.duo,steps:["Placez deux portes de 1,5 m\xE8tre \xE0 6 m\xE8tres l'une de l'autre, derri\xE8re vous.","L'enfant part \xE0 8 m\xE8tres, ballon au pied.","Il doit franchir l'une des deux portes en conduite.","D\xE9fendez \xE0 50 % : orientez-vous d'un c\xF4t\xE9 pour lui laisser une lecture."],mistakes:["Il choisit sa porte avant de partir.","Il ralentit en arrivant sur vous."],corrections:["\xAB Regarde mes pieds : va du c\xF4t\xE9 o\xF9 je ne peux pas aller. \xBB","\xAB Change de rythme au moment de la feinte. \xBB"],easy:"D\xE9fenseur qui marche.",medium:"D\xE9fenseur \xE0 50 %.",hard:"Limite de 6 secondes par duel.",success:"5 duels gagn\xE9s sur 8, avec au moins deux feintes diff\xE9rentes.",recoverySec:30,diagram:{kind:"mirror",caption:"Je lis le d\xE9fenseur, je choisis ma porte"},metricKey:"dribbles"}];var A=["pied","cheville","genou","jambe"],_e=[{slug:"marelle-du-footballeur",name:"La marelle du footballeur",category:"coordination",age:[4,8],level:"debutant",difficulty:1,objective:"Encha\xEEner des appuis un pied, deux pieds, en rythme.",skill:"Coordination des appuis",why:"Savoir poser ses pieds o\xF9 l'on veut est la base de tous les gestes du football.",durationMin:5,reps:"6 passages",equipment:["cerceau"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:2,bodyAreas:A,steps:["Tracez une marelle \xE0 la craie (ou posez des rep\xE8res).","Un pied dans les cases simples, deux pieds dans les cases doubles.","Au bout, un ballon l'attend : il le ram\xE8ne au pied.","Faites le parcours vous aussi : il adore vous voir essayer."],mistakes:["Il regarde ses pieds en permanence.","Il se pr\xE9cipite."],corrections:["\xAB Regarde la case suivante, pas celle o\xF9 tu es. \xBB","Tapez dans vos mains pour donner un rythme lent."],easy:"Cases larges, en marchant.",medium:"En sautillant.",hard:"\xC0 cloche-pied sur les cases simples, puis en arri\xE8re.",success:"Un passage complet sans sortir des cases.",diagram:{kind:"ladder",caption:"Un pied, deux pieds, en rythme"},metricKey:"coordination",isFree:!0},{slug:"echelle-de-rythme",name:"L'\xE9chelle de rythme",category:"coordination",age:[7,13],level:"debutant",difficulty:2,objective:"R\xE9aliser des appuis rapides et pr\xE9cis dans une \xE9chelle.",skill:"Fr\xE9quence et pr\xE9cision d'appuis",why:"Des appuis vifs permettent de d\xE9marrer, freiner et changer de direction : ils servent \xE0 tous les gestes.",durationMin:6,reps:"8 passages, retour en marchant",equipment:["echelle"],space:"petit",indoorOk:!0,parentRole:"observe",intensity:2,bodyAreas:A,steps:["Tracez 8 cases de 40 cm \xE0 la craie (ou utilisez une \xE9chelle).","Passage 1-2 : un appui par case.","Passage 3-4 : deux appuis par case.","Passages suivants : appuis lat\xE9raux, puis \xAB dedans-dedans-dehors-dehors \xBB."],mistakes:["Appuis lourds, sur les talons.","Bras immobiles.","Vitesse avant pr\xE9cision."],corrections:["\xAB Cours sur la pointe des pieds, sans bruit. \xBB","\xAB Tes bras aident tes jambes. \xBB","\xAB Juste d'abord, vite ensuite. \xBB"],easy:"Un appui par case, en marchant.",medium:"Deux appuis par case.",hard:"Encha\xEEner l'\xE9chelle avec une conduite de balle de 5 m\xE8tres.",success:"Deux passages de suite sans toucher les traits.",diagram:{kind:"ladder",caption:"Sur la pointe des pieds, sans bruit"},metricKey:"coordination"},{slug:"coordination-ballon-main-pied",name:"Main et pied",category:"coordination",age:[9,17],level:"intermediaire",difficulty:3,objective:"Dissocier le haut et le bas du corps : lancer un ballon \xE0 la main en conduisant l'autre au pied.",skill:"Dissociation",why:"Faire deux choses \xE0 la fois entra\xEEne le cerveau \xE0 lib\xE9rer l'attention : tr\xE8s utile pendant la croissance.",durationMin:6,reps:"4 s\xE9quences de 40 secondes",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:A,steps:["Il conduit son ballon au pied dans une zone.","En m\xEAme temps, vous \xE9changez \xE0 la main une balle (ou une paire de chaussettes roul\xE9e).","Il doit rattraper et relancer sans perdre son ballon au pied.","Changez de main \xE0 chaque s\xE9quence."],mistakes:["Il arr\xEAte son ballon pour attraper.","Il ne regarde plus que la balle."],corrections:["Ralentissez : marcher est autoris\xE9.","\xAB Une touche du pied entre chaque \xE9change. \xBB"],easy:"\xC0 l'arr\xEAt, semelle sur le ballon, \xE9changes \xE0 la main.",medium:"En marchant.",hard:"En trottinant, lancer \xE0 une main.",success:"8 \xE9changes r\xE9ussis sans perdre le ballon au pied.",diagram:{kind:"pair",caption:"Les mains jouent, les pieds aussi"},metricKey:"coordination"},{slug:"appuis-et-reprise-d-appuis",name:"Appuis crois\xE9s",category:"coordination",age:[12,17],level:"confirme",difficulty:4,objective:"Encha\xEEner pas crois\xE9s, pas chass\xE9s et reprise d'appuis avant un geste technique.",skill:"Coordination avanc\xE9e",why:"Pendant la croissance, les rep\xE8res changent. Retravailler les appuis aide \xE0 rester \xE0 l'aise dans son corps.",durationMin:7,reps:"6 passages, 45 secondes de pause",equipment:["plots","ballon"],space:"moyen",parentRole:"joue",intensity:3,bodyAreas:[...A,"hanche"],steps:["Posez 4 plots en ligne, espac\xE9s de 2 m\xE8tres.","Pas chass\xE9s jusqu'au 2\u1D49 plot, pas crois\xE9s jusqu'au 4\u1D49.","Au dernier plot : reprise d'appuis et passe que vous lui adressez.","Il vous la remet en une touche puis revient en marchant."],mistakes:["Buste qui tourne avec les jambes.","Dernier appui d\xE9s\xE9quilibr\xE9."],corrections:["\xAB \xC9paules face \xE0 moi, seules les hanches tournent. \xBB","\xAB Deux petits pas d'ajustement avant la passe. \xBB"],easy:"Pas chass\xE9s uniquement.",medium:"Chass\xE9s puis crois\xE9s.",hard:"Remise du pied faible, ou contr\xF4le orient\xE9 puis passe.",success:"4 passages fluides conclus par une remise pr\xE9cise.",recoverySec:45,diagram:{kind:"ladder",caption:"Chass\xE9s, crois\xE9s, reprise d'appuis"},metricKey:"coordination"},{slug:"le-flamant-rose",name:"Le flamant rose",category:"equilibre",age:[4,9],level:"debutant",difficulty:1,objective:"Tenir en \xE9quilibre sur un pied.",skill:"\xC9quilibre statique",why:"Chaque passe et chaque tir se fait sur un seul pied. L'\xE9quilibre est la fondation invisible du footballeur.",durationMin:4,reps:"3 essais par pied",equipment:[],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:["cheville"],steps:["Il se tient sur un pied, l'autre genou lev\xE9.","Comptez ensemble \xE0 voix haute.","Changez de pied.","Faites le concours avec lui (et perdez de temps en temps)."],mistakes:["Il sautille pour se rattraper.","Il fixe ses pieds."],corrections:["\xAB Plie un tout petit peu le genou qui porte. \xBB","\xAB Fixe un point devant toi, \xE0 hauteur des yeux. \xBB"],easy:"Bras \xE9cart\xE9s, 5 secondes.",medium:"Bras crois\xE9s, 10 \xE0 20 secondes.",hard:"Semelle sur le ballon, ou yeux ferm\xE9s 5 secondes.",success:"Il tient plus longtemps que la derni\xE8re fois, sur l'un des deux pieds.",diagram:{kind:"balance",caption:"Je fixe un point, je respire"},metricKey:"equilibre",isFree:!0},{slug:"equilibre-et-passe",name:"Sur un pied, je passe",category:"equilibre",age:[8,14],level:"intermediaire",difficulty:3,objective:"Renvoyer un ballon en restant en \xE9quilibre sur le pied d'appui.",skill:"\xC9quilibre dynamique",why:"Tenir sur un pied pendant qu'on joue le ballon rend les passes et les frappes plus pr\xE9cises.",durationMin:5,reps:"2 s\xE9ries de 8 par pied",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:["cheville","genou","hanche"],steps:["Il se tient sur un pied, \xE0 2 m\xE8tres de vous.","Lancez le ballon \xE0 la main vers son pied libre.","Il vous le renvoie de l'int\xE9rieur du pied, sans reposer le pied.","8 ballons, puis on change de pied."],mistakes:["Il repose le pied entre chaque ballon.","Genou d'appui verrouill\xE9."],corrections:["Laissez-lui 2 secondes entre deux lancers.","\xAB Genou souple, comme un ressort. \xBB"],easy:"Il peut reposer le pied entre chaque ballon.",medium:"Sans reposer le pied.",hard:"Renvoi en vol\xE9e, ou debout sur un coussin.",success:"6 renvois sur 8 sans reposer le pied.",diagram:{kind:"balance",caption:"Genou souple, je renvoie"},metricKey:"equilibre"},{slug:"etoile-d-equilibre",name:"L'\xE9toile",category:"equilibre",age:[11,17],level:"intermediaire",difficulty:3,objective:"Sur un pied, toucher du bout de l'autre pied des rep\xE8res plac\xE9s en \xE9toile.",skill:"Stabilit\xE9 et contr\xF4le du genou",why:"Un bon contr\xF4le de l'appui rend les changements de direction plus s\xFBrs et plus efficaces. C'est un exercice doux et utile \xE0 tout \xE2ge.",durationMin:5,reps:"2 tours d'\xE9toile par pied",equipment:["plots"],space:"petit",indoorOk:!0,parentRole:"observe",intensity:1,bodyAreas:["cheville","genou","hanche"],steps:["Posez 5 rep\xE8res en demi-cercle \xE0 environ un m\xE8tre de lui.","En appui sur un pied, il va toucher chaque rep\xE8re avec l'autre pied.","Il revient au centre entre chaque rep\xE8re, sans reposer le pied si possible.","Lentement : la qualit\xE9 compte, pas la vitesse."],mistakes:["Le genou d'appui rentre vers l'int\xE9rieur.","Il se laisse tomber vers le rep\xE8re."],corrections:["\xAB Ton genou reste au-dessus de ton pied. \xBB","\xAB Descends comme un ascenseur, lentement. \xBB"],easy:"Rep\xE8res proches, pied repos\xE9 entre chaque.",medium:"Sans reposer le pied.",hard:"Rep\xE8res plus \xE9loign\xE9s, ou ballon tenu \xE0 bout de bras.",success:"Un tour complet sans perdre l'\xE9quilibre, genou align\xE9.",diagram:{kind:"balance",n:5,caption:"Lentement, genou au-dessus du pied"},metricKey:"equilibre"},{slug:"le-parcours-des-animaux",name:"Le parcours des animaux",category:"motricite",age:[4,7],level:"debutant",difficulty:1,objective:"Se d\xE9placer de multiples fa\xE7ons : sauter, ramper, marcher \xE0 quatre pattes.",skill:"Motricit\xE9 g\xE9n\xE9rale",why:"Un enfant qui sait bouger de mille mani\xE8res apprendra tous les sports plus facilement, le football compris.",durationMin:5,reps:"3 parcours",equipment:[],space:"moyen",indoorOk:!0,parentRole:"joue",intensity:2,bodyAreas:["genou","dos"],steps:["Annoncez un animal : grenouille (sauts), ours (quatre pattes), crabe (sur le c\xF4t\xE9), kangourou (pieds joints).","Il traverse la zone en imitant l'animal.","Au retour, il choisit l'animal et c'est vous qui imitez.","Terminez par \xAB le gu\xE9pard qui ram\xE8ne son ballon \xBB."],mistakes:["Il se lasse si le parcours est toujours le m\xEAme."],corrections:["Laissez-le inventer un animal \xE0 chaque tour."],easy:"Deux animaux, trajets courts.",medium:"Quatre animaux encha\xEEn\xE9s.",hard:"Changer d'animal \xE0 votre signal en plein trajet.",success:"Il s'engage dans tous les d\xE9placements et en invente un.",diagram:{kind:"free",caption:"Grenouille, ours, crabe, kangourou"},metricKey:"coordination",isFree:!0},{slug:"lancer-attraper",name:"Lancer, rebond, attraper",category:"motricite",age:[4,8],level:"debutant",difficulty:1,objective:"Lancer et rattraper un ballon \xE0 deux mains, seul puis \xE0 deux.",skill:"Coordination \u0153il-main",why:"Suivre un ballon des yeux et anticiper sa trajectoire sert ensuite pour les contr\xF4les et le jeu de t\xEAte.",durationMin:4,reps:"15 \xE9changes",equipment:["ballon"],space:"petit",parentRole:"joue",intensity:1,bodyAreas:[],steps:["Il lance le ballon en l'air et le rattrape apr\xE8s un rebond.","Puis sans rebond.","\xC9changez ensuite \xE0 deux, \xE0 2 m\xE8tres.","Ajoutez un d\xE9fi : taper dans ses mains avant de rattraper."],mistakes:["Il ferme les yeux \xE0 l'arriv\xE9e du ballon.","Lancers trop hauts."],corrections:["Utilisez un ballon plus l\xE9ger ou d\xE9gonfl\xE9.","\xAB Pas plus haut que ta t\xEAte. \xBB"],easy:"Avec rebond.",medium:"Sans rebond, \xE0 deux.",hard:"Un tour sur soi-m\xEAme avant de rattraper.",success:"10 ballons rattrap\xE9s sur 15.",diagram:{kind:"pair",caption:"Je suis le ballon des yeux"},metricKey:"coordination"},{slug:"sauts-et-receptions",name:"Sauter et bien atterrir",category:"motricite",age:[8,14],level:"debutant",difficulty:2,objective:"Apprendre \xE0 atterrir en douceur, genoux fl\xE9chis et align\xE9s.",skill:"R\xE9ception de saut",why:"Bien atterrir, genoux souples et align\xE9s, m\xE9nage les genoux et les chevilles. C'est un apprentissage simple, utile pour toute la vie sportive.",durationMin:5,reps:"2 s\xE9ries de 6 sauts, 1 minute de pause",equipment:["plots"],space:"petit",parentRole:"observe",intensity:2,bodyAreas:["cheville","genou"],safety:"Sol souple (herbe, tapis). Sauts bas uniquement. On s'arr\xEAte \xE0 la moindre g\xEAne aux genoux ou aux talons.",steps:["Il saute par-dessus une ligne ou un plot couch\xE9, pieds joints.","Il atterrit \xAB comme un chat \xBB : sans bruit, genoux pli\xE9s.","Il tient la position 2 secondes.","Puis saut sur le c\xF4t\xE9, puis d'un pied sur deux pieds."],mistakes:["Atterrissage bruyant, jambes l:"Cr\xE9ativit\xE9 et autonomie",why:"Les enfants qui inventent restent motiv\xE9s plus longtemps. Le jeu libre est aussi un entra\xEEnement.",durationMin:5,reps:"Un jeu, 5 minutes",equipment:["ballon"],space:"moyen",indoorOk:!0,parentRole:"joue",intensity:2,bodyAreas:[],steps:["Dites : \xAB aujourd'hui, c'est toi l'entra\xEEneur pendant 5 minutes \xBB.","Il invente une r\xE8gle, un parcours ou un d\xE9fi.","Vous suivez ses consignes sans les am\xE9liorer.","\xC0 la fin, demandez-lui le nom de son jeu et notez-le dans l'album."],mistakes:["Le parent reprend la main.","\xAB Je ne sais pas quoi inventer \xBB."],corrections:["Posez seulement des questions : \xAB et si je rate, il se passe quoi ? \xBB","Proposez deux ingr\xE9dients : \xAB un jeu avec un plot et le pied gauche \xBB."],easy:"Il change une r\xE8gle d'un jeu connu.",medium:"Il invente un jeu complet.",hard:"Il doit l'expliquer et l'arbitrer.",success:"Il a propos\xE9 au moins une id\xE9e et l'a essay\xE9e.",diagram:{kind:"free",caption:"Aujourd'hui, c'est lui l'entra\xEEneur"},isFree:!0},{slug:"la-fabrique-a-gestes",name:"La fabrique \xE0 gestes",category:"creativite",age:[7,17],level:"debutant",difficulty:2,objective:"Combiner deux gestes connus pour cr\xE9er un encha\xEEnement personnel.",skill:"Cr\xE9ativit\xE9 technique",why:"Assembler ses propres encha\xEEnements d\xE9veloppe l'aisance et la personnalit\xE9 du joueur.",durationMin:6,reps:"3 cr\xE9ations",equipment:["ballon"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:A,steps:["Il choisit deux gestes qu'il conna\xEEt (semelle, crochet, passement, r\xE2teau\u2026).","Il les encha\xEEne lentement.","Il donne un nom \xE0 sa cr\xE9ation.","Il la refait trois fois, puis vous la montre \xAB \xE0 vitesse de match \xBB."],mistakes:["Il veut un geste trop difficile et se frustre."],corrections:["\xAB Commence par deux gestes que tu r\xE9ussis d\xE9j\xE0. \xBB"],easy:"Deux gestes sur place.",medium:"Deux gestes en mouvement.",hard:"Trois gestes, conclus par une passe ou une frappe.",success:"Un encha\xEEnement invent\xE9, nomm\xE9 et r\xE9p\xE9t\xE9 trois fois.",diagram:{kind:"zigzag",n:2,caption:"Deux gestes, un nom, ma signature"}},{slug:"match-aux-petits-buts",name:"Le match aux petits buts",category:"creativite",age:[5,17],level:"debutant",difficulty:2,objective:"Jouer un vrai petit match \xE0 un contre un ou deux contre deux.",skill:"Jeu r\xE9el",why:"Rien ne remplace le jeu. Le match r\xE9duit multiplie les touches de balle, les duels et le plaisir.",durationMin:8,reps:"3 manches de 2 minutes, 1 minute de pause",equipment:["ballon","but"],space:"moyen",parentRole:"joue",intensity:3,bodyAreas:A,safety:k.duo,steps:["Deux petits buts d'un m\xE8tre, terrain d'environ 10 \xD7 6 m\xE8tres.","Jouez \xE0 un contre un (ou avec fr\xE8res et s\u0153urs).","Adaptez votre niveau : il doit marquer r\xE9guli\xE8rement.","Bonus : un but apr\xE8s une feinte compte double."],mistakes:["Le parent joue trop fort\u2026 ou laisse tout passer."],corrections:["Visez un score serr\xE9 : il doit sentir que ses buts sont m\xE9rit\xE9s."],easy:"Vous d\xE9fendez en marchant.",medium:"Vous jouez \xE0 50 %.",hard:"Il n'a droit qu'\xE0 trois touches, ou marque uniquement du pied faible.",success:"Il a tent\xE9 des duels et a envie d'une revanche.",recoverySec:60,diagram:{kind:"mirror",caption:"Du jeu, des duels, des buts"}},{slug:"mes-trois-reussites",name:"Mes trois r\xE9ussites",category:"confiance",age:[4,17],level:"debutant",difficulty:1,objective:"Nommer trois choses r\xE9ussies pendant la s\xE9ance.",skill:"Confiance en soi",why:"Le cerveau retient plus facilement les rat\xE9s. Nommer ses r\xE9ussites r\xE9\xE9quilibre la m\xE9moire et nourrit la confiance.",durationMin:3,reps:"Une fois, en fin de s\xE9ance",equipment:[],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:[],steps:["Asseyez-vous ensemble, ballon entre vous.","Il cite trois choses qu'il a r\xE9ussies ou os\xE9es aujourd'hui.","Vous en ajoutez une, li\xE9e \xE0 son effort (\xAB tu as recommenc\xE9 apr\xE8s avoir rat\xE9 \xBB).","Vous pouvez en noter une dans l'album de souvenirs."],mistakes:["Le parent encha\xEEne avec \xAB mais\u2026 \xBB."],corrections:["Ce moment ne contient aucune critique. Les axes de progr\xE8s attendront la prochaine s\xE9ance."],easy:"Une seule r\xE9ussite, aid\xE9 par vos questions.",medium:"Trois r\xE9ussites.",hard:"Il dit aussi ce qu'il a envie d'essayer la prochaine fois.",success:"Il repart avec au moins une r\xE9ussite en t\xEAte.",diagram:{kind:"pair",caption:"Trois r\xE9ussites, z\xE9ro \xAB mais \xBB"},metricKey:"confiance",isFree:!0},{slug:"la-respiration-du-ballon",name:"La respiration du ballon",category:"confiance",age:[6,17],level:"debutant",difficulty:1,objective:"Se calmer et se concentrer par la respiration.",skill:"Gestion des \xE9motions",why:"Savoir retrouver son calme sert avant un match, apr\xE8s une erreur\u2026 et en dehors du football.",durationMin:3,reps:"5 respirations",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:[],steps:["Allong\xE9 ou assis, le ballon pos\xE9 sur le ventre.","Il inspire par le nez : le ballon monte (4 secondes).","Il souffle par la bouche : le ballon descend (6 secondes).","Cinq fois. Faites-le en m\xEAme temps que lui."],mistakes:["Il gonfle la poitrine au lieu du ventre."],corrections:["\xAB Fais monter le ballon comme un ascenseur, tout doucement. \xBB"],easy:"Trois respirations.",medium:"Cinq respirations, yeux ferm\xE9s.",hard:"Il choisit un mot qui l'aide (\xAB calme \xBB, \xAB pr\xEAt \xBB) et le pense en soufflant.",success:"Il termine plus calme qu'il n'a commenc\xE9.",diagram:{kind:"balance",caption:"J'inspire, le ballon monte"},metricKey:"confiance"},{slug:"le-defi-rate-volontaire",name:"Le droit de rater",category:"confiance",age:[7,17],level:"debutant",difficulty:2,objective:"Tenter un geste difficile en acceptant de le rater plusieurs fois.",skill:"Rapport \xE0 l'erreur",why:"Un enfant qui n'a pas peur de rater ose davantage, et un enfant qui ose progresse plus vite.",durationMin:5,reps:"10 essais",equipment:["ballon"],space:"petit",parentRole:"joue",intensity:1,bodyAreas:[],steps:["Il choisit un geste qu'il ne r\xE9ussit pas encore.","R\xE8gle du jeu : il a droit \xE0 10 essais, et chaque rat\xE9 rapporte un point \xAB courage \xBB.","Vous essayez vous aussi un geste difficile pour vous.","\xC0 la fin : \xAB qu'est-ce qui a chang\xE9 entre le premier et le dernier essai ? \xBB"],mistakes:["Le parent corrige \xE0 chaque essai.","L'enfant s'\xE9nerve."],corrections:["Une seule piste au 5\u1D49 essai, rien avant.","Faites une pause respiration, riez de votre propre rat\xE9."],easy:"Un geste \xAB presque acquis \xBB.",medium:"Un geste nouveau.",hard:"Il explique lui-m\xEAme ce qu'il va modifier entre deux essais.",success:"Il est all\xE9 au bout des 10 essais.",diagram:{kind:"juggle",caption:"Chaque essai compte"},metricKey:"confiance"},{slug:"pirate-voleur-de-ballon",name:"Le pirate",category:"parent-enfant",age:[4,8],level:"debutant",difficulty:1,objective:"Prot\xE9ger son ballon face \xE0 un parent qui essaie gentiment de le prendre.",skill:"Protection de balle",why:"Garder son ballon quand quelqu'un s'approche donne de l'assurance et apprend \xE0 placer son corps.",durationMin:4,reps:"4 manches de 30 secondes",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:A,safety:k.duo,steps:["D\xE9limitez une \xAB \xEEle \xBB d'environ 6 \xD7 6 m\xE8tres.","Il conduit son ballon, vous \xEAtes le pirate.","Approchez-vous lentement en faisant du bruit de pirate.","S'il sort de l'\xEEle ou perd son ballon, il le r\xE9cup\xE8re et on repart."],mistakes:["Il fuit en ligne droite hors de la zone.","Le pirate est trop efficace."],corrections:["\xAB Mets ton corps entre le pirate et le ballon. \xBB","Ratez volontairement vos tentatives 3 fois sur 4."],easy:"Pirate qui marche \xE0 reculons.",medium:"Pirate qui marche.",hard:"Deux ballons : chacun prot\xE8ge le sien et attaque l'autre.",success:"Il garde son ballon 30 secondes au moins une fois.",diagram:{kind:"square",caption:"Mon corps prot\xE8ge le ballon"},isFree:!0},{slug:"le-tunnel",name:"Le tunnel",category:"parent-enfant",age:[4,9],level:"debutant",difficulty:1,objective:"Faire passer le ballon entre les jambes du parent.",skill:"Pr\xE9cision et plaisir",why:"Le \xAB petit pont \xBB fait rire tous les enfants. C'est un exercice de pr\xE9cision d\xE9guis\xE9 en jeu.",durationMin:4,reps:"10 essais, puis on inverse",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:["pied"],steps:["Tenez-vous debout, jambes \xE9cart\xE9es, \xE0 3 m\xE8tres.","Il fait rouler le ballon entre vos jambes.","\xC0 chaque r\xE9ussite, reculez d'un pas.","Inversez : c'est lui le tunnel (et vous ratez un peu)."],mistakes:["Il frappe trop fort."],corrections:["\xAB Le ballon doit rouler, pas voler. \xBB"],easy:"\xC0 2 m\xE8tres, jambes tr\xE8s \xE9cart\xE9es.",medium:"\xC0 4 m\xE8tres.",hard:"Le tunnel se d\xE9place lentement sur le c\xF4t\xE9.",success:"5 petits ponts sur 10.",diagram:{kind:"pair",caption:"Le petit pont !"},metricKey:"passes",isFree:!0},{slug:"relais-famille",name:"Le relais de la famille",category:"parent-enfant",age:[5,14],level:"debutant",difficulty:2,objective:"R\xE9aliser un parcours en relais, \xE0 deux ou \xE0 plusieurs.",skill:"Coop\xE9ration",why:"R\xE9ussir ensemble cr\xE9e de la complicit\xE9. Le relais convient aussi tr\xE8s bien aux fr\xE8res et s\u0153urs d'\xE2ges diff\xE9rents.",durationMin:6,reps:"4 relais",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:A,steps:["Installez un mini-parcours : 3 plots \xE0 slalomer et une porte \xE0 franchir.","Chacun fait le parcours puis passe le ballon au suivant.","Objectif commun : r\xE9ussir 4 relais sans faire tomber un plot.","Pour les plus petits, le parcours est raccourci : m\xEAme \xE9quipe, d\xE9fi adapt\xE9."],mistakes:["La comp\xE9tition entre fr\xE8res et s\u0153urs prend le dessus."],corrections:["Une seule \xE9quipe : la famille contre le chrono ou contre le nombre de plots tomb\xE9s."],easy:"Parcours court, en marchant.",medium:"Parcours complet.",hard:"Chaque relayeur ajoute une contrainte de son choix.",success:"Le relais est termin\xE9 ensemble, chacun \xE0 son niveau.",diagram:{kind:"slalom",n:3,caption:"Une seule \xE9quipe : la famille"}},{slug:"passes-a-dix-famille",name:"Les 10 passes",category:"parent-enfant",age:[8,17],level:"debutant",difficulty:2,objective:"Encha\xEEner dix passes \xE0 deux en se d\xE9pla\xE7ant.",skill:"Jeu \xE0 deux",why:"Compter ensemble vers un objectif commun fait oublier qu'on s'entra\xEEne. Id\xE9al pour finir une s\xE9ance.",durationMin:5,reps:"3 tentatives",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:A,steps:["D\xE9placez-vous tous les deux dans une zone de 10 \xD7 10 m\xE8tres.","\xC9changez des passes en mouvement en comptant \xE0 voix haute.","Si le ballon s'arr\xEAte ou sort, on repart de z\xE9ro.","\xC0 dix : c\xE9l\xE9bration obligatoire."],mistakes:["Passes faites \xE0 l'arr\xEAt.","Il ne se d\xE9place pas apr\xE8s sa passe."],corrections:["\xAB On n'a pas le droit de passer sans bouger. \xBB","Montrez-lui o\xF9 aller en tendant le bras."],easy:"Deux touches autoris\xE9es, \xE0 courte distance.",medium:"Deux touches, en mouvement.",hard:"Une touche, ou pied faible uniquement.",success:"Dix passes encha\xEEn\xE9es au moins une fois.",diagram:{kind:"triangle",caption:"On compte ensemble jusqu'\xE0 dix"},metricKey:"passes"}];var v=["pied","cheville","genou","jambe"],js=e=>{let{mk:a,co:r,...o}=e;return{...o,mistakes:a,corrections:r}},es=[{slug:"semelle-magique",name:"La semelle magique",category:"conduite",age:[5,10],level:"debutant",difficulty:1,objective:"Faire rouler le ballon sous la semelle dans toutes les directions.",skill:"Toucher de balle",why:"La semelle est la surface la plus rassurante : elle apprend \xE0 garder le ballon sous contr\xF4le sans le frapper.",durationMin:4,reps:"30 secondes par pied, 3 fois",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"observe",intensity:1,bodyAreas:["pied","cheville"],steps:["Debout, un pied pos\xE9 sur le ballon.","Il le fait rouler d'avant en arri\xE8re, sans le perdre.","Puis de droite \xE0 gauche.","Enfin il dessine un cercle avec le ballon."],mk:["Il regarde le ballon sans arr\xEAt.","Jambe d'appui raide."],co:["\xAB Jette un coup d'\u0153il vers moi toutes les trois touches. \xBB","\xAB Sautille un peu sur ton pied d'appui. \xBB"],easy:"Avant-arri\xE8re seulement.",medium:"Avant-arri\xE8re puis c\xF4t\xE9-c\xF4t\xE9.",hard:"En se d\xE9pla\xE7ant de 5 m\xE8tres, semelle uniquement.",success:"30 secondes sans que le ballon s'\xE9chappe.",diagram:{kind:"balance",caption:"La semelle caresse le ballon"},metricKey:"conduite",isFree:!0},{slug:"interieur-exterieur",name:"Int\xE9rieur-ext\xE9rieur",category:"conduite",age:[8,14],level:"intermediaire",difficulty:3,objective:"Avancer en alternant int\xE9rieur et ext\xE9rieur du m\xEAme pied.",skill:"Surfaces de contact",why:"Passer d'une surface \xE0 l'autre permet de changer de direction sans changer de pied : c'est la base des dribbles.",durationMin:5,reps:"4 travers\xE9es de 10 m\xE8tres par pied",equipment:["ballon","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:v,steps:["Deux plots espac\xE9s de 10 m\xE8tres.","Il avance en touchant le ballon de l'int\xE9rieur, puis de l'ext\xE9rieur du m\xEAme pied.","Le ballon dessine un petit zigzag.","Retour avec l'autre pied."],mk:["Touches trop appuy\xE9es.","Il n'utilise que l'int\xE9rieur."],co:["\xAB Le ballon ne s'\xE9loigne pas de plus d'un pied. \xBB","Annoncez \xAB int\xE9 \xBB et \xAB ext\xE9 \xBB \xE0 voix haute au rythme de ses touches."],easy:"En marchant.",medium:"En trottinant.",hard:"En acc\xE9l\xE9rant sur les 3 derniers m\xE8tres.",success:"Une travers\xE9e compl\xE8te en alternant sans erreur.",diagram:{kind:"zigzag",n:4,caption:"Int\xE9, ext\xE9, int\xE9, ext\xE9"},metricKey:"conduite"},{slug:"les-demi-tours",name:"Les demi-tours",category:"conduite",age:[9,18],level:"intermediaire",difficulty:3,objective:"Faire demi-tour ballon au pied de trois fa\xE7ons diff\xE9rentes.",skill:"Changement de sens",why:"Savoir repartir dans l'autre sens prot\xE8ge le ballon et surprend l'adversaire.",durationMin:6,reps:"3 s\xE9ries de 6 demi-tours",equipment:["ballon","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:v,steps:["Deux plots \xE0 6 m\xE8tres.","Demi-tour 1 : il bloque de la semelle et tire le ballon derri\xE8re lui.","Demi-tour 2 : crochet de l'int\xE9rieur du pied.","Demi-tour 3 : crochet de l'ext\xE9rieur du pied."],mk:["Il fait un grand arc au lieu d'un demi-tour.","Il s'arr\xEAte apr\xE8s avoir tourn\xE9."],co:["\xAB Tourne sur place, comme sur une pi\xE8ce de monnaie. \xBB","\xAB Deux pas rapides d\xE8s que tu as tourn\xE9. \xBB"],easy:"Semelle uniquement, en marchant.",medium:"Les trois demi-tours, en trottinant.",hard:"Le parent annonce le type de demi-tour au dernier moment.",success:"6 demi-tours nets, ballon toujours \xE0 port\xE9e.",diagram:{kind:"slalom",n:2,caption:"Je bloque, je tourne, je repars"},metricKey:"conduite"},{slug:"le-couloir",name:"Le couloir",category:"conduite",age:[6,11],level:"debutant",difficulty:2,objective:"Conduire le ballon tout droit dans un couloir \xE9troit.",skill:"Conduite en ligne",why:"Garder le ballon dans l'axe demande de petites touches r\xE9guli\xE8res : c'est la base de la conduite rapide.",durationMin:5,reps:"6 travers\xE9es",equipment:["ballon","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:v,steps:["Tracez un couloir d'un m\xE8tre de large et de 8 m\xE8tres de long.","Il traverse ballon au pied sans sortir.","Il revient avec l'autre pied.","R\xE9tr\xE9cissez le couloir d'une main apr\xE8s deux r\xE9ussites."],mk:["Le ballon sort sur le c\xF4t\xE9.","Il pousse le ballon et court derri\xE8re."],co:["\xAB Touche avec les lacets, pointe du pied vers le bas. \xBB","\xAB Une touche tous les deux pas. \xBB"],easy:"Couloir de 1,5 m\xE8tre, en marchant.",medium:"Couloir de 1 m\xE8tre, en trottinant.",hard:"Couloir de 60 cm, pied faible.",success:"4 travers\xE9es sur 6 sans sortir.",diagram:{kind:"slalom",n:2,caption:"Tout droit, petites touches"},metricKey:"conduite"},{slug:"accelere-freine",name:"Acc\xE9l\xE8re et freine",category:"conduite",age:[10,18],level:"intermediaire",difficulty:3,objective:"Changer de rythme ballon au pied : lent, rapide, arr\xEAt.",skill:"Changement de rythme",why:"Ce n'est pas la vitesse qui \xE9limine un d\xE9fenseur, c'est le changement de vitesse.",durationMin:6,reps:"6 passages, 45 secondes de pause",equipment:["ballon","plots"],space:"grand",parentRole:"observe",intensity:3,bodyAreas:v,recoverySec:45,safety:"\xC9chauffement avant. Sol non glissant. On s'arr\xEAte si les appuis deviennent impr\xE9cis ou \xE0 la moindre douleur.",steps:["Trois zones de 6 m\xE8tres d\xE9limit\xE9es par des plots.","Zone 1 : conduite lente. Zone 2 : acc\xE9l\xE9ration. Zone 3 : il freine et bloque le ballon.","Retour en marchant.","Changez l'ordre des zones \xE0 chaque s\xE9rie."],mk:["Pas de diff\xE9rence nette entre lent et rapide.","Le ballon part trop loin \xE0 l'acc\xE9l\xE9ration."],co:["\xAB Presque en marchant, puis \xE0 fond. \xBB","\xAB Premi\xE8re touche plus longue, les suivantes courtes. \xBB"],easy:"Deux zones : lent puis rapide.",medium:"Trois zones.",hard:"Le parent crie \xAB change \xBB : il change de rythme imm\xE9diatement.",success:"4 passages avec trois rythmes bien distincts.",diagram:{kind:"slalom",n:3,caption:"Lent \xB7 rapide \xB7 stop"},metricKey:"conduite"},{slug:"cuisse-et-attrape",name:"Cuisse et attrape",category:"jonglage",age:[6,10],level:"debutant",difficulty:1,objective:"Faire rebondir le ballon sur la cuisse et le rattraper.",skill:"Toucher de balle",why:"La cuisse est une grande surface : id\xE9ale pour r\xE9ussir ses premiers jongles et prendre confiance.",durationMin:4,reps:"10 essais par cuisse",equipment:["ballon"],space:"petit",parentRole:"observe",intensity:1,bodyAreas:["hanche"],steps:["Ballon tenu \xE0 deux mains devant le ventre.","Il le l\xE2che sur sa cuisse lev\xE9e \xE0 l'horizontale.","Le ballon remonte, il le rattrape.","Puis deux rebonds avant de rattraper."],mk:["Cuisse trop basse : le ballon part devant.","Il lance le ballon vers le haut."],co:["\xAB Ta cuisse est une table bien plate. \xBB","\xAB Ouvre seulement les mains. \xBB"],easy:"Un rebond, on rattrape.",medium:"Deux rebonds sur la m\xEAme cuisse.",hard:"Cuisse droite, cuisse gauche, on rattrape.",success:"6 ballons rattrap\xE9s sur 10.",diagram:{kind:"juggle",caption:"Cuisse \xE0 plat comme une table"},metricKey:"jongles"},{slug:"droite-gauche",name:"Droite, gauche",category:"jonglage",age:[9,18],level:"intermediaire",difficulty:3,objective:"Jongler en alternant pied droit et pied gauche.",skill:"Jonglage des deux pieds",why:"Alterner les pieds \xE9quilibre le corps et d\xE9veloppe le pied faible sans y penser.",durationMin:5,reps:"5 essais, 30 secondes de pause",equipment:["ballon"],space:"petit",parentRole:"observe",intensity:1,bodyAreas:["pied","cheville"],steps:["D\xE9part ballon en main.","Un jongle du pied droit, un du pied gauche.","Le ballon reste \xE0 hauteur de genou.","Il compte les paires r\xE9ussies."],mk:["Le ballon tourne et s'\xE9loigne.","Il compense toujours avec le bon pied."],co:["\xAB Cheville ferme, pointe l\xE9g\xE8rement relev\xE9e. \xBB","Autorisez un rebond au sol avant le pied faible."],easy:"Un rebond entre chaque pied.",medium:"Sans rebond, 3 paires.",hard:"Deux touches par pied avant de changer.",success:"3 paires droite-gauche encha\xEEn\xE9es.",diagram:{kind:"juggle",caption:"Un pied, puis l'autre"},metricKey:"jongles"},{slug:"jongle-et-controle",name:"Jongle, laisse tomber, contr\xF4le",category:"jonglage",age:[9,16],level:"intermediaire",difficulty:3,objective:"Encha\xEEner quelques jongles puis contr\xF4ler le ballon au sol proprement.",skill:"Du jonglage au jeu",why:"Jongler n'est pas une fin en soi : cet encha\xEEnement relie le toucher de balle \xE0 un geste de match.",durationMin:5,reps:"8 encha\xEEnements",equipment:["ballon"],space:"petit",parentRole:"observe",intensity:1,bodyAreas:["pied","cheville"],steps:["Trois jongles au choix.","Il laisse le ballon retomber.","Au rebond, il l'amortit de la semelle ou de l'int\xE9rieur.","Il part aussit\xF4t en conduite sur 3 m\xE8tres."],mk:["Le contr\xF4le part loin.","Il s'arr\xEAte apr\xE8s le contr\xF4le."],co:["\xAB Pose ton pied sur le ballon comme sur un \u0153uf. \xBB","\xAB Ton contr\xF4le est d\xE9j\xE0 ta premi\xE8re touche de conduite. \xBB"],easy:"Un seul jongle avant le contr\xF4le.",medium:"Trois jongles.",hard:"Contr\xF4le orient\xE9 vers un plot annonc\xE9.",success:"6 encha\xEEnements sur 8 avec le ballon \xE0 moins d'un pas.",diagram:{kind:"juggle",caption:"Je jongle, j'amortis, je pars"},metricKey:"jongles"},{slug:"jongler-en-avancant",name:"Jongler en avan\xE7ant",category:"jonglage",age:[11,18],level:"confirme",difficulty:4,objective:"Parcourir quelques m\xE8tres en jonglant.",skill:"Ma\xEEtrise en mouvement",why:"Jongler en se d\xE9pla\xE7ant oblige \xE0 doser chaque touche : un excellent travail de pr\xE9cision et d'\xE9quilibre.",durationMin:5,reps:"5 travers\xE9es de 5 m\xE8tres",equipment:["ballon","plots"],space:"moyen",parentRole:"aucun",intensity:2,bodyAreas:["pied","cheville","hanche"],steps:["Deux plots \xE0 5 m\xE8tres.","Il d\xE9marre ses jongles sur place.","Il pousse l\xE9g\xE8rement chaque touche vers l'avant et marche.","S'il perd le ballon, il repart de l'endroit o\xF9 il est tomb\xE9."],mk:["Touches trop vers l'avant : il court apr\xE8s.","Buste pench\xE9 en arri\xE8re."],co:["\xAB Le ballon avance d'un demi-pas, pas plus. \xBB","\xAB Reste au-dessus du ballon. \xBB"],easy:"3 m\xE8tres, cuisses autoris\xE9es.",medium:"5 m\xE8tres, pieds uniquement.",hard:"Aller-retour avec demi-tour sans poser le ballon.",success:"Une travers\xE9e de 5 m\xE8tres sans que le ballon touche le sol.",diagram:{kind:"juggle",caption:"Un demi-pas \xE0 chaque touche"},metricKey:"jongles"},{slug:"jongles-a-deux",name:"Les jongles \xE0 deux",category:"jonglage",age:[10,18],level:"intermediaire",difficulty:3,objective:"S'\xE9changer le ballon en l'air avec le parent.",skill:"Jonglage coop\xE9ratif",why:"\xC0 deux, il faut doser pour l'autre : on travaille le toucher et l'entraide en m\xEAme temps.",durationMin:5,reps:"5 tentatives",equipment:["ballon"],space:"petit",parentRole:"joue",intensity:1,bodyAreas:["pied","cheville"],steps:["Face \xE0 face, \xE0 2 m\xE8tres.","Il jongle deux fois puis vous envoie le ballon en cloche.","Vous faites de m\xEAme (ou vous le rattrapez \xE0 la main et le relancez).","Comptez ensemble le nombre d'\xE9changes."],mk:["Passe trop forte ou trop tendue.","Il s'\xE9nerve quand le parent rate."],co:["\xAB Envoie-le en cloche, \xE0 hauteur de ma poitrine. \xBB","Riez de vos propres rat\xE9s : c'est un jeu d'\xE9quipe."],easy:"Un rebond autoris\xE9 \xE0 chaque \xE9change.",medium:"Sans rebond, deux touches maximum.",hard:"Une seule touche chacun.",success:"4 \xE9changes encha\xEEn\xE9s.",diagram:{kind:"pair",caption:"Je dose pour mon partenaire"},metricKey:"jongles"},{slug:"semelle-et-pousse",name:"Semelle et pousse",category:"controle",age:[6,10],level:"debutant",difficulty:2,objective:"Arr\xEAter le ballon de la semelle puis le pousser sur le c\xF4t\xE9.",skill:"Contr\xF4le et premi\xE8re touche",why:"Arr\xEAter puis d\xE9caler le ballon en deux gestes simples pr\xE9pare au contr\xF4le orient\xE9.",durationMin:5,reps:"10 ballons par pied",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:["pied","cheville"],steps:["Passez-lui le ballon au sol depuis 4 m\xE8tres.","Il l'arr\xEAte de la semelle.","Du m\xEAme pied, il le pousse d'un pas sur le ite cr\xE9e du danger.",durationMin:7,reps:"2 s\xE9ries de 6, 1 minute de pause",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:[...v,"hanche"],recoverySec:60,steps:["Il se place dos \xE0 une porte situ\xE9e 5 m\xE8tres derri\xE8re lui.","Passez-lui le ballon au sol.","Il jette un coup d'\u0153il par-dessus l'\xE9paule, puis se retourne avec le ballon.","Il franchit la porte en conduite."],mk:["Il se retourne sans avoir regard\xE9.","Il s'arr\xEAte sur le ballon."],co:["\xAB Regarde avant que le ballon arrive. \xBB","\xAB Laisse le ballon courir vers ton pied le plus \xE9loign\xE9. \xBB"],easy:"Deux touches, sans opposition.",medium:"Une touche pour se retourner.",hard:"Le parent le suit dans le dos en marchant.",success:"4 retournements fluides sur 6.",diagram:{kind:"gates",caption:"Coup d'\u0153il, puis je pivote"},metricKey:"controle"},{slug:"le-mur-surprise",name:"Le mur surprise",category:"controle",age:[9,16],level:"intermediaire",difficulty:3,objective:"Contr\xF4ler un ballon qui revient du mur \xE0 une hauteur impr\xE9vue.",skill:"Adaptation du contr\xF4le",why:"En match, aucun ballon n'arrive deux fois pareil. Le mur cr\xE9e cette vari\xE9t\xE9 tout seul.",durationMin:6,reps:"3 s\xE9ries de 8",equipment:["ballon","mur"],space:"petit",parentRole:"observe",intensity:2,bodyAreas:v,safety:k.mur,steps:["\xC0 4 m\xE8tres du mur.","Il frappe le ballon contre le mur, \xE0 des hauteurs diff\xE9rentes.","Il contr\xF4le le retour en une touche, quelle que soit la hauteur.","Deuxi\xE8me touche : il rejoue contre le mur."],mk:["Il attend le ballon sur place.","Il frappe toujours au m\xEAme endroit."],co:["\xAB Va \xE0 la rencontre du ballon. \xBB","Dessinez trois croix \xE0 la craie : il les vise \xE0 tour de r\xF4le."],easy:"Frappes au sol uniquement.",medium:"Sol et mi-hauteur.",hard:"Le parent frappe \xE0 sa place, il ne sait pas o\xF9 le ballon ira.",success:"6 contr\xF4les sur 8 ma\xEEtris\xE9s en une touche.",diagram:{kind:"wall",caption:"Je m'adapte au rebond"},metricKey:"controle"},{slug:"la-passe-appuyee",name:"La passe appuy\xE9e",category:"passes",age:[10,18],level:"intermediaire",difficulty:3,objective:"R\xE9ussir une passe au sol ferme et pr\xE9cise \xE0 12-15 m\xE8tres.",skill:"Passe mi-longue",why:"Une passe molle est une passe intercept\xE9e. Appuyer sans lever le ballon est une vraie comp\xE9tence.",durationMin:6,reps:"2 s\xE9ries de 10",equipment:["ballon","plots"],space:"grand",parentRole:"joue",intensity:2,bodyAreas:[...v,"hanche"],steps:["Placez-vous \xE0 12 m\xE8tres, une porte de 1,5 m\xE8tre devant vous.","Il passe au sol, fort, \xE0 travers la porte.","Vous lui renvoyez.","Reculez d'un pas apr\xE8s trois r\xE9ussites."],mk:["Le ballon d\xE9colle.","Passe forte mais impr\xE9cise."],co:["\xAB Frappe au milieu du ballon, genou au-dessus. \xBB","\xAB Ton pied d'appui montre la cible. \xBB"],easy:"\xC0 8 m\xE8tres.",medium:"\xC0 12 m\xE8tres.",hard:"\xC0 15 m\xE8tres, pied faible.",success:"6 passes sur 10 au sol dans la porte.",diagram:{kind:"gates",n:1,caption:"Ferme, au sol, dans la porte"},metricKey:"passes"},{slug:"le-carre-de-passes",name:"Le carr\xE9 de passes",category:"passes",age:[9,16],level:"intermediaire",difficulty:3,objective:"Encha\xEEner passes et d\xE9placements autour d'un carr\xE9.",skill:"Passe et replacement",why:"Passer puis se replacer sur un nouvel angle : c'est le mouvement de base du jeu de possession.",durationMin:7,reps:"3 s\xE9ries d'une minute",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["Carr\xE9 de 6 m\xE8tres de c\xF4t\xE9.","Vous \xEAtes chacun sur un plot voisin.","Il vous passe le ballon, puis court vers le plot libre suivant.","Vous lui passez sur ce nouveau plot, puis vous vous d\xE9placez \xE0 votre tour."],mk:["Il passe l\xE0 o\xF9 vous \xE9tiez, pas l\xE0 o\xF9 vous allez.","Contr\xF4le face au mauvais c\xF4t\xE9."],co:["\xAB Passe devant moi, dans ma course. \xBB","\xAB Ouvre-toi vers l
