sez 6 bouteilles en triangle \xE0 5 m\xE8tres.","Deux lancers chacun pour tout faire tomber.","Comptez les quilles tomb\xE9es.","Battez votre total commun \xE0 la partie suivante."],mk:["Ballon qui rebondit.","Il vise une quille sur le c\xF4t\xE9."],co:["\xAB Le ballon doit rouler sans d\xE9coller. \xBB","\xAB Vise la quille de devant : elle fait tomber les autres. \xBB"],easy:"\xC0 3 m\xE8tres.",medium:"\xC0 5 m\xE8tres.",hard:"\xC0 7 m\xE8tres, pied faible.",success:"Au moins 4 quilles en deux lancers.",diagram:{kind:"target",n:3,caption:"\xC7a roule droit"},metricKey:"passes",isFree:!0},{slug:"le-cerceau",name:"Le ballon dans le cerceau",category:"precision",age:[7,13],level:"intermediaire",difficulty:3,objective:"Faire retomber le ballon dans une zone avec une passe en cloche.",skill:"Pr\xE9cision a\xE9rienne",why:"Doser une trajectoire en l'air demande du toucher : c'est le d\xE9but des passes longues.",durationMin:6,reps:"3 s\xE9ries de 6",equipment:["ballon","cerceau"],space:"moyen",parentRole:"observe",intensity:1,bodyAreas:["pied","cheville"],steps:["Posez un cerceau (ou tracez un cercle) \xE0 5 m\xE8tres.","Il l\xE2che le ballon de ses mains et le frappe en cloche.","Le ballon doit retomber dans le cercle.","Ensuite, ballon pos\xE9 au sol."],mk:["Trajectoire tendue.","Trop de force."],co:["\xAB Frappe sous le ballon, pied ouvert. \xBB","\xAB Le ballon doit monter plus haut que ta t\xEAte, pas plus loin. \xBB"],easy:"Ballon l\xE2ch\xE9 des mains, \xE0 3 m\xE8tres.",medium:"Ballon au sol, \xE0 5 m\xE8tres.",hard:"\xC0 8 m\xE8tres, cercle plus petit.",success:"3 ballons sur 6 retombent dans le cercle.",diagram:{kind:"target",n:1,caption:"En cloche, dans le cercle"},metricKey:"passes"},{slug:"les-portes-a-points",name:"Les portes \xE0 points",category:"precision",age:[7,13],level:"debutant",difficulty:2,objective:"Choisir entre des portes larges et \xE9troites qui rapportent plus ou moins.",skill:"Pr\xE9cision et choix",why:"Choisir son risque fait partie du jeu : cet exercice m\xEAle adresse et d\xE9cision.",durationMin:6,reps:"10 passes",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:1,bodyAreas:["pied","cheville"],steps:["Trois portes \xE0 6 m\xE8tres : large (1 point), moyenne (2 points), \xE9troite (3 points).","Il a 10 passes pour marquer le plus de points possible.","Il annonce la porte vis\xE9e avant chaque passe.","Notez le total : il essaiera de le battre la prochaine fois."],mk:["Il ne vise que la plus \xE9troite et rate tout.","Il n'annonce pas sa cible."],co:["\xAB Commence par assurer, puis ose. \xBB","Pas d'annonce, pas de points."],easy:"Portes de 2 m, 1,5 m et 1 m.",medium:"Portes de 1,5 m, 1 m et 60 cm.",hard:"Ballon en mouvement avant chaque passe.",success:"Battre ou \xE9galer son total pr\xE9c\xE9dent.",diagram:{kind:"target",n:3,caption:"Une, deux ou trois points ?"},metricKey:"passes"},{slug:"la-transversale",name:"La transversale",category:"precision",age:[13,18],level:"confirme",difficulty:4,objective:"R\xE9ussir une longue passe a\xE9rienne dans une zone.",skill:"Jeu long",why:"Changer le jeu d'un c\xF4t\xE9 \xE0 l'autre demande une frappe propre plus qu'une frappe forte.",durationMin:7,reps:"2 s\xE9ries de 6, 1 minute de pause",equipment:["ballon","plots"],space:"grand",parentRole:"joue",intensity:2,bodyAreas:[...v,"hanche"],recoverySec:60,safety:"\xC9chauffement complet avant de frapper long. Peu de r\xE9p\xE9titions : on s'arr\xEAte \xE0 la moindre g\xEAne \xE0 la hanche ou \xE0 la cuisse.",steps:["Tracez une zone de 5 \xD7 5 m\xE8tres \xE0 18-20 m\xE8tres.","Ballon pos\xE9, deux pas d'\xE9lan en biais.","Il frappe sous le ballon avec le cou-de-pied, cheville verrouill\xE9e.","Vous \xEAtes dans la zone et contr\xF4lez sa passe."],mk:["Il force et se d\xE9s\xE9quilibre.","Trajectoire basse."],co:["\xAB Frappe propre \xE0 70 %, le ballon ira loin. \xBB","\xAB Pied d'appui un peu en retrait, buste l\xE9g\xE8rement en arri\xE8re. \xBB"],easy:"\xC0 12 m\xE8tres, grande zone.",medium:"\xC0 18 m\xE8tres.",hard:"Ballon en mouvement, puis pied faible \xE0 distance r\xE9duite.",success:"3 passes sur 6 retombent dans la zone.",diagram:{kind:"target",n:1,caption:"Propre plut\xF4t que fort"},metricKey:"passes"},{slug:"le-plat-du-pied",name:"Le plat du pied dans le coin",category:"finition",age:[8,14],level:"debutant",difficulty:2,objective:"Placer le ballon dans un coin du but avec l'int\xE9rieur du pied.",skill:"Frappe plac\xE9e",why:"La plupart des buts se marquent en pla\xE7ant, pas en frappant fort.",durationMin:6,reps:"2 s\xE9ries de 8",equipment:["ballon","but","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:v,safety:k.tir,steps:["Posez un plot \xE0 un m\xE8tre de chaque poteau : ce sont les coins.","Ballon \xE0 8 m\xE8tres.","Il frappe de l'int\xE9rieur du pied entre le plot et le poteau.","Un coin, puis l'autre."],mk:["Il veut frapper fort.","Il regarde le ballon au moment de frapper sans avoir choisi son coin."],co:["\xAB C'est une passe au filet. \xBB","\xAB Choisis ton coin avant ton \xE9lan. \xBB"],easy:"\xC0 6 m\xE8tres, coins larges.",medium:"\xC0 8 m\xE8tres.",hard:"Apr\xE8s une conduite de 3 m\xE8tres, coin annonc\xE9 par le parent.",success:"5 frappes sur 8 dans un coin.",diagram:{kind:"target",n:0,caption:"Une passe dans le coin"},metricKey:"frappes"},{slug:"le-cou-de-pied",name:"La frappe du cou-de-pied",category:"finition",age:[10,18],level:"intermediaire",difficulty:3,objective:"Frapper avec les lacets, ballon tendu et cadr\xE9.",skill:"Frappe tendue",why:"Le cou-de-pied donne de la puissance sans forcer, \xE0 condition d'avoir le bon geste.",durationMin:7,reps:"2 s\xE9ries de 6, 1 minute de pause",equipment:["ballon","but"],space:"grand",parentRole:"observe",intensity:3,bodyAreas:[...v,"hanche"],recoverySec:60,safety:k.tir,steps:["Ballon pos\xE9 \xE0 12 m\xE8tres.","Pied d'appui \xE0 c\xF4t\xE9 du ballon, point\xE9 vers le but.","Pointe du pied vers le bas, il frappe le milieu du ballon avec les lacets.","Il termine son geste en retombant sur le pied de frappe."],mk:["Le ballon monte.","Il frappe de la pointe."],co:["\xAB Genou au-dessus du ballon au moment de frapper. \xBB","\xAB Pointe vers le sol, cheville verrouill\xE9e. \xBB"],easy:"\xC0 8 m\xE8tres, \xE0 60 % de puissance.",medium:"\xC0 12 m\xE8tres.",hard:"Ballon qui roule doucement vers lui.",success:"4 frappes cadr\xE9es sur 6, sous la hauteur de hanche.",diagram:{kind:"target",n:0,caption:"Genou au-dessus du ballon"},metricKey:"frappes"},{slug:"le-duel-avec-le-gardien",name:"Le duel avec le gardien",category:"finition",age:[8,16],level:"intermediaire",difficulty:3,objective:"Marquer face \xE0 un gardien qui avance.",skill:"Face-\xE0-face",why:"Seul devant le gardien, il faut rester calme et choisir : contourner ou placer.",durationMin:7,reps:"8 duels, 30 secondes de pause",equipment:["ballon","but"],space:"grand",parentRole:"joue",intensity:3,bodyAreas:v,safety:k.duo,steps:["Vous \xEAtes gardien, il part \xE0 15 m\xE8tres du but.","Il avance en conduite, vous sortez \xE0 sa rencontre en marchant.","Il choisit : tirer \xE0 c\xF4t\xE9 de vous ou vous contourner.","Changez de r\xF4le de temps en temps."],mk:["Il tire trop t\xF4t, de loin.","Il fonce droit sur le gardien."],co:["\xAB Avance jusqu'\xE0 ce que je bouge. \xBB","\xAB Regarde de quel c\xF4t\xE9 je laisse de la place. \xBB"],easy:"Gardien immobile sur sa ligne.",medium:"Gardien qui sort en marchant.",hard:"6 secondes maximum par duel.",success:"5 buts sur 8 duels.",diagram:{kind:"target",n:0,caption:"Calme, je choisis"},metricKey:"frappes"},{slug:"la-demi-volee",name:"La demi-vol\xE9e",category:"finition",age:[12,18],level:"confirme",difficulty:4,objective:"Frapper le ballon juste apr\xE8s son rebond.",skill:"Frappe sur ballon a\xE9rien",why:"Les ballons qui rebondissent dans la surface sont fr\xE9quents : il faut savoir les reprendre sans les envoyer dans les nuages.",durationMin:6,reps:"2 s\xE9ries de 6, 1 minute de pause",equipment:["ballon","but"],space:"grand",parentRole:"joue",intensity:3,bodyAreas:[...v,"hanche"],recoverySec:60,safety:k.tir,steps:["\xC0 10 m\xE8tres du but, il l\xE2che le ballon de ses mains.","Il le frappe au moment o\xF9 il touche le sol.","Genou au-dessus, buste pench\xE9.","Ensuite, c'est vous qui lancez le ballon en cloche."],mk:["Le ballon s'envole.","Il frappe trop tard, ballon d\xE9j\xE0 remont\xE9."],co:["\xAB Penche-toi sur le ballon. \xBB","\xAB Frappe quand tu entends le rebond. \xBB"],easy:"Il l\xE2che lui-m\xEAme le ballon.",medium:"Le parent lance en cloche, de face.",hard:"Lancer venant du c\xF4t\xE9.",success:"3 frappes cadr\xE9es sur 6.",diagram:{kind:"target",n:0,caption:"Je frappe au rebond"},metricKey:"frappes"},{slug:"dribble-et-tir",name:"Dribble et tir",category:"finition",age:[9,16],level:"intermediaire",difficulty:3,objective:"\xC9liminer un plot puis frapper aussit\xF4t.",skill:"Encha\xEEnement dribble-frappe",why:"Apr\xE8s un dribble, on a tr\xE8s peu de temps : il faut frapper dans la foul\xE9e.",durationMin:7,reps:"2 s\xE9ries de 6",equipment:["ballon","but","plots"],space:"grand",parentRole:"observe",intensity:3,bodyAreas:v,safety:k.tir,steps:["Un plot \xAB d\xE9fenseur \xBB \xE0 10 m\xE8tres du but.","Il arrive en conduite, feinte et passe le plot d'un c\xF4t\xE9.","Il frappe en deux touches maximum apr\xE8s le dribble.","Un c\xF4t\xE9, puis l'autre."],mk:["Il s'arr\xEAte apr\xE8s le dribble.","Dribble trop large : l'angle se ferme."],co:["\xAB Ton dribble doit t'emmener vers le but. \xBB","\xAB Feinte, pousse, frappe : trois temps. \xBB"],easy:"En trottinant, frappe libre.",medium:"Frappe en deux touches.",hard:"Le parent remplace le plot et tend la jambe d'un c\xF4t\xE9.",success:"4 frappes cadr\xE9es sur 6.",diagram:{kind:"target",n:0,caption:"Feinte, pousse, frappe"},metricKey:"frappes"},{slug:"la-feinte-de-corps",name:"La feinte de corps",category:"dribbles",age:[7,13],level:"debutant",difficulty:2,objective:"Faire croire qu'on part d'un c\xF4t\xE9 en penchant le corps, puis partir de l'autre.",skill:"Feinte simple",why:"C'est le dribble le plus naturel : pas besoin de geste compliqu\xE9, le corps suffit \xE0 tromper.",durationMin:5,reps:"3 s\xE9ries de 6",equipment:["ballon","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:v,steps:["Un plot \xAB d\xE9fenseur \xBB \xE0 5 m\xE8tres.","Il avance lentement vers le plot.","Il penche l'\xE9paule et pose un pied franchement d'un c\xF4t\xE9.","Il pousse le ballon de l'autre c\xF4t\xE9 avec l'ext\xE9rieur du pied et acc\xE9l\xE8re."],mk:["Feinte timide, \xE0 peine visible.","Il ne change pas de vitesse."],co:["\xAB Exag\xE8re : je dois y croire. \xBB","\xAB Lent, feinte, vite. \xBB"],easy:"Sans ballon d'abord, juste le pas de c\xF4t\xE9.",medium:"Avec ballon, en trottinant.",hard:"Face au parent qui r\xE9agit \xE0 la feinte.",success:"5 feintes sur 6 suivies d'une acc\xE9l\xE9ration.",diagram:{kind:"zigzag",n:2,caption:"L'\xE9paule ment, le pied part"},metricKey:"dribbles"},{slug:"le-rateau",name:"Le r\xE2teau",category:"dribbles",age:[9,16],level:"intermediaire",difficulty:3,objective:"Ramener le ballon vers soi de la semelle puis le pousser sur le c\xF4t\xE9.",skill:"Dribble semelle",why:"Le r\xE2teau retire le ballon au moment o\xF9 le d\xE9fenseur se jette : simple et tr\xE8s efficace.",durationMin:6,reps:"3 s\xE9ries de 6",equipment:["ballon","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:v,steps:["Sur place d'abord : semelle sur le ballon, il le tire vers lui.","Du m\xEAme pied, il le pousse sur le c\xF4t\xE9 de l'int\xE9rieur.","Puis en avan\xE7ant vers un plot.","Enfin en acc\xE9l\xE9rant apr\xE8s le geste."],mk:["Il tire le ballon trop loin derri\xE8re lui.","Deux gestes s\xE9par\xE9s au lieu d'un seul mouvement."],co:["\xAB Tire le ballon jusque sous toi, pas plus. \xBB","\xAB Tire-pousse, d'un seul geste. \xBB"],easy:"Sur place.",medium:"En marchant vers un plot.",hard:"Face au parent qui tend la jambe.",success:"5 r\xE2teaux fluides sur 6.",diagram:{kind:"zigzag",n:2,caption:"Je tire, je pousse"},metricKey:"dribbles"},{slug:"la-roulette",name:"La roulette",category:"dribbles",age:[11,18],level:"confirme",difficulty:4,objective:"Tourner sur soi-m\xEAme en prot\xE9geant le ballon avec les deux semelles.",skill:"Dribble en rotation",why:"La roulette prot\xE8ge le ballon avec le corps tout en changeant de direction.",durationMin:6,reps:"3 s\xE9ries de 5",equipment:["ballon","plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:[...v,"hanche"],steps:["Au ralenti : il pose la semelle droite sur le ballon et le tire en arri\xE8re.","Il pivote d'un demi-tour.","La semelle gauche reprend le ballon et le tire dans la nouvelle direction.","Il termine son tour et repart."],mk:["Il perd le ballon pendant la rotation.","Il tourne sans avancer."],co:["\xAB D\xE9compose : semelle, tourne, semelle. \xBB","\xAB Le ballon avance pendant que tu tournes. \xBB"],easy:"Sur place, au ralenti.",medium:"En marchant vers un plot.",hard:"En trottinant, des deux c\xF4t\xE9s.",success:"3 roulettes sur 5 sans perdre le ballon.",diagram:{kind:"circle",n:2,caption:"Semelle, je tourne, semelle"},metricKey:"dribbles"},{slug:"la-foret-de-plots",name:"La for\xEAt de plots",category:"dribbles",age:[6,11],level:"debutant",difficulty:2,objective:"Circuler ballon au pied dans une zone remplie d'obstacles.",skill:"Dribble libre",why:"Sans parcours impos\xE9, l'enfant invente ses trajectoires et l\xE8ve la t\xEAte pour \xE9viter les obstacles.",durationMin:5,reps:"4 manches de 40 secondes",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["\xC9parpillez 8 \xE0 10 plots dans une zone de 8 \xD7 8 m\xE8tres.","Il conduit son ballon sans toucher aucun \xAB arbre \xBB.","\xC0 votre signal, il contourne l'arbre le plus proche et repart.","Promenez-vous dans la for\xEAt : vous \xEAtes un arbre qui bouge."],mk:["Il tourne toujours dans le m\xEAme sens.","Il regarde ses pieds et percute les plots."],co:["\xAB Cette fois, contourne par la gauche. \xBB","\xAB Cherche d\xE9j\xE0 ton prochain arbre. \xBB"],easy:"5 plots, en marchant.",medium:"10 plots.",hard:"Chaque arbre contourn\xE9 avec un dribble diff\xE9rent.",success:"40 secondes sans toucher de plot.",diagram:{kind:"free",caption:"Je cherche mon chemin"},metricKey:"dribbles"},{slug:"la-corde-a-sauter",name:"La corde \xE0 sauter",category:"coordination",age:[6,14],level:"debutant",difficulty:2,objective:"Sauter \xE0 la corde de plusieurs fa\xE7ons.",skill:"Rythme et appuis",why:"La corde d\xE9veloppe le rythme, la l\xE9g\xE8ret\xE9 des appuis et la coordination bras-jambes.",durationMin:4,reps:"4 s\xE9ries de 30 secondes",equipment:[],space:"petit",parentRole:"observe",intensity:2,bodyAreas:["cheville","genou","jambe"],steps:["Sauts pieds joints, bas et l\xE9gers.","Puis en alternant les pieds, comme en courant sur place.","Puis deux sauts sur un pied, deux sur l'autre.","Sans corde ? Il mime le geste : le travail est presque le m\xEAme."],mk:["Sauts trop hauts.","Il atterrit sur les talons."],co:["\xAB D\xE9colle juste assez pour la corde. \xBB","\xAB Sur la pointe des pieds, sans bruit. \xBB"],easy:"Sans corde, sauts sur place.",medium:"Avec corde, pieds joints.",hard:"En alternant les pieds, puis en arri\xE8re.",success:"20 sauts encha\xEEn\xE9s sans accrocher.",diagram:{kind:"balance",caption:"L\xE9ger, sur la pointe des pieds"},metricKey:"coordination"},{slug:"les-tap-tap",name:"Les tap-tap",category:"coordination",age:[6,13],level:"debutant",difficulty:2,objective:"Toucher le dessus du ballon avec la semelle, un pied apr\xE8s l'autre, en rythme.",skill:"Coordination avec ballon",why:"Ce geste simple am\xE9liore l'\xE9quilibre, le rythme et le rapport au ballon en tr\xE8s peu de place.",durationMin:4,reps:"4 s\xE9ries de 20 secondes",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"observe",intensity:2,bodyAreas:["cheville","jambe"],steps:["Ballon immobile devant lui.","Il pose la semelle droite dessus, puis la gauche, en sautillant.","Le ballon ne doit presque pas bouger.","Comptez ses touches en 20 secondes."],mk:["Il appuie : le ballon roule.","Il regarde uniquement le ballon."],co:["\xAB Effleure-le, comme s'il \xE9tait br\xFBlant. \xBB","\xAB L\xE8ve les yeux toutes les quatre touches. \xBB"],easy:"En marchant sur place.",medium:"En sautillant.",hard:"En tournant autour du ballon.",success:"20 touches en 20 secondes sans faire rouler le ballon.",diagram:{kind:"balance",caption:"Droite, gauche, l\xE9ger"},metricKey:"coordination",isFree:!0},{slug:"cloche-pied-et-passe",name:"Cloche-pied et passe",category:"coordination",age:[9,15],level:"intermediaire",difficulty:3,objective:"Encha\xEEner des sauts \xE0 cloche-pied puis une passe pr\xE9cise.",skill:"Coordination et pr\xE9cision",why:"R\xE9ussir un geste technique juste apr\xE8s un effort de coordination reproduit ce qui se passe en match.",durationMin:6,reps:"6 passages, 30 secondes de pause",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["Quatre rep\xE8res au sol espac\xE9s de 60 cm.","Il les franchit \xE0 cloche-pied.","\xC0 la sortie, vous lui passez le ballon.","Il vous le remet en une touche, puis revient en marchant."],mk:["R\xE9ception lourde apr\xE8s le dernier saut.","Passe b\xE2cl\xE9e."],co:["\xAB Stabilise-toi une seconde avant la passe. \xBB","\xAB La passe compte autant que les sauts. \xBB"],easy:"Sauts pieds joints.",medium:"\xC0 cloche-pied.",hard:"Cloche-pied sur le pied faible, remise du pied oppos\xE9.",success:"5 passages conclus par une remise pr\xE9cise.",diagram:{kind:"ladder",caption:"Je saute, je me stabilise, je passe"},metricKey:"coordination"},{slug:"les-gammes-du-coureur",name:"Les gammes du coureur",category:"coordination",age:[10,18],level:"intermediaire",difficulty:2,objective:"R\xE9aliser les \xE9ducatifs de course : mont\xE9es de genoux, talons-fesses, pas chass\xE9s.",skill:"Technique de course",why:"Bien courir s'apprend. Ces \xE9ducatifs am\xE9liorent la foul\xE9e et pr\xE9parent le corps \xE0 l'effort.",durationMin:5,reps:"2 travers\xE9es de 10 m\xE8tres par \xE9ducatif",equipment:["plots"],space:"moyen",parentRole:"observe",intensity:2,bodyAreas:[...v,"hanche"],steps:["Deux plots \xE0 10 m\xE8tres.","Mont\xE9es de genoux, buste droit.","Talons-fesses.","Pas chass\xE9s, puis course arri\xE8re. Retour en marchant \xE0 chaque fois."],mk:["Buste pench\xE9 en arri\xE8re.","Il va vite au lieu de faire juste."],co:["\xAB Grandis-toi, regard \xE0 l'horizon. \xBB","\xAB Beaucoup d'appuis, peu de distance. \xBB"],easy:"Deux \xE9ducatifs seulement.",medium:"Les quatre \xE9ducatifs.",hard:"Chaque \xE9ducatif se termine par 5 m\xE8tres d'acc\xE9l\xE9ration.",success:"Chaque \xE9ducatif r\xE9alis\xE9 avec le buste droit.",diagram:{kind:"ladder",caption:"Juste avant d'\xEAtre rapide"},metricKey:"coordination"},{slug:"la-statue-musicale",name:"La statue musicale",category:"equilibre",age:[4,8],level:"debutant",difficulty:1,objective:"S'immobiliser en \xE9quilibre quand la musique s'arr\xEAte.",skill:"\xC9quilibre et arr\xEAt",why:"S'arr\xEAter net et tenir sa position fait travailler l'\xE9quilibre en s'amusant.",durationMin:4,reps:"6 arr\xEAts",equipment:[],space:"petit",indoorOk:!0,parentRole:"joue",intensity:2,bodyAreas:["cheville"],steps:["Mettez de la musique (ou chantez).","Il danse ou trottine.","Quand la musique s'arr\xEAte : statue sur un pied.","Trois secondes sans bouger, puis \xE7a repart."],mk:["Il pose le deuxi\xE8me pied.","Il s'arr\xEAte en d\xE9s\xE9quilibre."],co:["\xAB \xC9carte les bras comme un avion. \xBB","\xAB Plie un peu le genou pour t'arr\xEAter. \xBB"],easy:"Statue sur deux pieds.",medium:"Statue sur un pied.",hard:"Statue sur un pied avec un ballon dans les mains au-dessus de la t\xEAte.",success:"4 statues sur 6 tenues trois secondes.",diagram:{kind:"balance",caption:"Stop ! Statue sur un pied"},metricKey:"equilibre"},{slug:"equilibre-et-semelle",name:"Un pied sur terre, un pied sur le ballon",category:"equilibre",age:[7,13],level:"intermediaire",difficulty:2,objective:"Tenir sur un pied pendant que l'autre fait rouler le ballon.",skill:"\xC9quilibre avec ballon",why:"C'est exactement la position du joueur qui prot\xE8ge ou manipule son ballon.",durationMin:4,reps:"3 s\xE9ries de 20 secondes par pied",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"observe",intensity:1,bodyAreas:["cheville","genou"],steps:["En appui sur un pied.","L'autre semelle fait rouler le ballon : avant, arri\xE8re, sur les c\xF4t\xE9s.","Le pied d'appui ne bouge pas.","Changez de pied."],mk:["Le pied d'appui sautille.","Il s'appuie sur le ballon."],co:["\xAB Enfonce ton pied d'appui dans le sol. \xBB","\xAB Le ballon ne te porte pas, il se prom\xE8ne. \xBB"],easy:"Petits mouvements du ballon.",medium:"Grands cercles avec le ballon.",hard:"Les yeux vers le parent, qui montre des doigts \xE0 compter.",success:"20 secondes par pied sans reposer le pied libre.",diagram:{kind:"balance",caption:"Le pied d'appui ne bouge pas"},metricKey:"equilibre"},{slug:"le-funambule",name:"Le funambule",category:"equilibre",age:[5,10],level:"debutant",difficulty:1,objective:"Marcher sur une ligne sans en sortir.",skill:"\xC9quilibre en d\xE9placement",why:"Garder son \xE9quilibre en avan\xE7ant pr\xE9pare aux courses et aux changements d'appuis.",durationMin:4,reps:"4 travers\xE9es",equipment:[],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:["cheville"],steps:["Tracez une ligne de 4 m\xE8tres (craie, ficelle, joint de carrelage).","Il marche dessus, un pied devant l'autre.","Puis en arri\xE8re.","Puis avec un ballon tenu au-dessus de la t\xEAte."],mk:["Il va trop vite.","Il regarde ses pieds."],co:["\xAB Le funambule avance lentement. \xBB","\xAB Regarde le bout de la corde. \xBB"],easy:"En avant, bras \xE9cart\xE9s.",medium:"En arri\xE8re.",hard:"Avec un demi-tour au milieu, ballon dans les mains.",success:"Une travers\xE9e compl\xE8te sans sortir de la ligne.",diagram:{kind:"balance",caption:"Un pied devant l'autre"},metricKey:"equilibre"},{slug:"saut-et-stabilisation",name:"Saut et stabilisation sur un pied",category:"equilibre",age:[12,18],level:"intermediaire",difficulty:3,objective:"Sauter d'un pied sur l'autre et se stabiliser deux secondes.",skill:"Stabilit\xE9 d'appui",why:"Savoir se stabiliser sur un pied apr\xE8s un saut aide \xE0 ma\xEEtriser les changements de direction.",durationMin:5,reps:"2 s\xE9ries de 6 par c\xF4t\xE9, 45 secondes de pause",equipment:["plots"],space:"petit",parentRole:"observe",intensity:2,bodyAreas:["cheville","genou","hanche"],recoverySec:45,safety:"Sol souple et non glissant. Sauts courts. On s'arr\xEAte \xE0 la moindre g\xEAne au genou ou \xE0 la cheville.",steps:["Deux rep\xE8res au sol espac\xE9s de 80 cm.","Il saute lat\xE9ralement du pied droit vers le pied gauche.","Il atterrit genou fl\xE9chi et tient deux secondes.","Il repart dans l'autre sens."],mk:["Le genou rentre vers l'int\xE9rieur.","Il encha\xEEne sans se stabiliser."],co:["\xAB Genou au-dessus des orteils. \xBB","\xAB Compte un, deux, puis repars. \xBB"],easy:"Rep\xE8res \xE0 50 cm.",medium:"Rep\xE8res \xE0 80 cm.",hard:"Il re\xE7oit et renvoie une passe pendant la stabilisation.",success:"5 r\xE9ceptions stables sur 6 de chaque c\xF4t\xE9.",diagram:{kind:"balance",n:5,caption:"J'atterris, je tiens deux secondes"},metricKey:"equilibre"},{slug:"debout-couche",name:"Debout, couch\xE9",category:"motricite",age:[6,12],level:"debutant",difficulty:1,objective:"Se relever rapidement depuis diff\xE9rentes positions au sol.",skill:"Agilit\xE9 au sol",why:"Au football, on tombe et on se rel\xE8ve sans cesse. Se relever vite est une vraie qualit\xE9.",durationMin:4,reps:"6 d\xE9parts, 30 secondes de pause",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:["genou","dos"],safety:"Sur l'herbe ou un sol souple uniquement. On s'arr\xEAte \xE0 la moindre douleur.",steps:["Il s'allonge sur le ventre, un ballon pos\xE9 \xE0 4 m\xE8tres.","\xC0 votre signal, il se rel\xE8ve et va poser le pied sur le ballon.","Variez : sur le dos, assis en tailleur, \xE0 genoux.","Faites la course avec lui de temps en temps."],mk:["Il se rel\xE8ve en s'appuyant longtemps sur les mains.","Il part avant le signal."],co:["\xAB Ram\xE8ne vite un pied sous toi. \xBB","Faites de faux signaux pour jouer."],easy:"D\xE9part assis.",medium:"D\xE9part allong\xE9 sur le ventre.",hard:"D\xE9part sur le dos, t\xEAte \xE0 l'oppos\xE9 du ballon.",success:"Il encha\xEEne les six d\xE9parts sans s'emm\xEAler.",diagram:{kind:"reaction",caption:"Hop, debout !"},metricKey:"coordination"},{slug:"dribble-a-la-main",name:"Le dribble \xE0 la main",category:"motricite",age:[5,10],level:"debutant",difficulty:1,objective:"Faire rebondir le ballon \xE0 la main en se d\xE9pla\xE7ant.",skill:"Coordination \u0153il-main",why:"Manipuler le ballon avec les mains affine la perception des rebonds, utile ensuite avec les pieds.",durationMin:4,reps:"3 parcours",equipment:["ballon"],space:"petit",parentRole:"joue",intensity:1,bodyAreas:[],steps:["Il fait rebondir le ballon sur place, d'une main.","Puis en marchant.","Puis en changeant de main.","Parcours : contourner deux objets en dribblant \xE0 la main."],mk:["Il tape le ballon au lieu de le pousser.","Il le regarde sans arr\xEAt."],co:["\xAB Ta main accompagne le ballon vers le bas. \xBB","\xAB Essaie de me regarder pendant deux rebonds. \xBB"],easy:"Sur place, \xE0 deux mains.",medium:"En marchant, d'une main.",hard:"En trottinant, en changeant de main \xE0 chaque objet.",success:"Un parcours complet sans perdre le ballon.",diagram:{kind:"free",caption:"La main accompagne"},metricKey:"coordination"},{slug:"le-parcours-du-jardin",name:"Le parcours du jardin",category:"motricite",age:[5,11],level:"debutant",difficulty:2,objective:"Encha\xEEner passer dessus, dessous, autour.",skill:"Motricit\xE9 globale",why:"Franchir, ramper, contourner : plus le r\xE9pertoire de mouvements est riche, plus l'enfant est \xE0 l'aise avec son corps.",durationMin:6,reps:"4 parcours",equipment:["plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:["genou","dos"],steps:["Installez 4 ateliers avec ce que vous avez : passer sous une chaise, sauter une ficelle, contourner un arbre, marcher sur une ligne.","Il fait le parcours une premi\xE8re fois en marchant.","Puis plus vite.","Dernier tour : il termine en ramenant un ballon au pied."],mk:["Il b\xE2cle les ateliers pour aller vite.","Parcours trop difficile."],co:["\xAB Chaque atelier doit \xEAtre r\xE9ussi pour continuer. \xBB","Simplifiez un atelier plut\xF4t que de le laisser \xE9chouer trois fois."],easy:"3 ateliers.",medium:"4 ateliers.",hard:"Il invente et ajoute un cinqui\xE8me atelier.",success:"Un parcours complet sans faute.",diagram:{kind:"free",caption:"Dessus, dessous, autour"},metricKey:"coordination"},{slug:"les-marches-fortes",name:"Les marches fortes",category:"motricite",age:[8,14],level:"intermediaire",difficulty:2,objective:"Se d\xE9placer en appui sur les mains et les pieds.",skill:"Gainage en mouvement",why:"Ces d\xE9placements renforcent tout le corps naturellement, avec le seul poids de l'enfant.",durationMin:5,reps:"3 travers\xE9es de 6 m\xE8tres par d\xE9placement",equipment:[],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:["dos","hanche"],safety:"Sol propre et souple. Pas de douleur aux poignets : on arr\xEAte sinon.",steps:["L'ours : mains et pieds au sol, genoux d\xE9coll\xE9s.","Le crabe : ventre vers le ciel, sur les mains et les pieds.","La chenille : mains qui avancent, puis pieds qui rejoignent.","Retour en marchant, bras rel\xE2ch\xE9s."],mk:["Fesses tr\xE8s hautes ou dos creus\xE9.","Trop de distance."],co:["\xAB Ton dos est une table. \xBB","Raccourcissez : 4 m\xE8tres bien faits valent mieux que 10."],easy:"L'ours seulement, 4 m\xE8tres.",medium:"Les trois d\xE9placements.",hard:"L'ours en marche arri\xE8re.",success:"Chaque travers\xE9e r\xE9alis\xE9e dos plat.",diagram:{kind:"free",caption:"Ours, crabe, chenille"},metricKey:"coordination"},{slug:"mobilite-du-footballeur",name:"La mobilit\xE9 du footballeur",category:"motricite",age:[12,18],level:"debutant",difficulty:1,objective:"R\xE9aliser une routine douce de mobilit\xE9 des chevilles, des hanches et du dos.",skill:"Mobilit\xE9",why:"Pendant la croissance, le corps se raidit. Cinq minutes de mobilit\xE9 aident \xE0 rester \xE0 l'aise dans ses mouvements.",durationMin:5,reps:"Un passage, lentement",equipment:[],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:[],safety:"Mouvements lents, sans \xE0-coup et sans douleur. Ce n'est pas un \xE9tirement forc\xE9.",steps:["Chevilles : genou vers le mur, talon au sol, 8 fois par c\xF4t\xE9.","Hanches : grandes fentes lentes, 6 par c\xF4t\xE9.","Dos : \xE0 quatre pattes, dos rond puis dos creux, 8 fois.","Terminez debout par de grands cercles de bras."],mk:["Il va vite.","Il force pour aller plus loin."],co:["\xAB Trois secondes pour descendre, trois pour remonter. \xBB","\xAB On s'arr\xEAte d\xE8s que \xE7a tire. \xBB"],easy:"Deux mouvements au choix.",medium:"La routine compl\xE8te.",hard:"La routine en autonomie, avant ou apr\xE8s son entra\xEEnement en club.",success:"La routine est faite lentement et sans douleur.",diagram:{kind:"balance",caption:"Lentement, sans forcer"}},{slug:"la-course-aux-couleurs",name:"La course aux couleurs",category:"vitesse",age:[5,9],level:"debutant",difficulty:1,objective:"Courir vite vers la couleur annonc\xE9e.",skill:"R\xE9action et course",why:"R\xE9agir \xE0 une information puis courir : c'est la vitesse telle qu'elle existe dans le jeu.",durationMin:4,reps:"8 d\xE9parts, 20 secondes de pause",equipment:["plots"],space:"moyen",parentRole:"joue",intensity:3,bodyAreas:v,recoverySec:20,steps:["Posez 4 objets de couleurs diff\xE9rentes \xE0 5 m\xE8tres autour de lui.","Annoncez une couleur.","Il court la toucher et revient au centre en marchant.","Variez : montrez la couleur au lieu de la dire."],mk:["Il part avant l'annonce.","Encha\xEEnement sans repos."],co:["Commencez votre phrase par un autre mot : \xAB Va toucher\u2026 le bleu ! \xBB","Le retour se fait toujours en marchant."],easy:"Deux couleurs.",medium:"Quatre couleurs.",hard:"Deux couleurs \xE0 encha\xEEner dans l'ordre annonc\xE9.",success:"7 bonnes couleurs sur 8.",diagram:{kind:"reaction",caption:"J'\xE9coute, je fonce"}},{slug:"les-departs-varies",name:"Les d\xE9parts vari\xE9s",category:"vitesse",age:[8,14],level:"debutant",difficulty:2,objective:"D\xE9marrer vite depuis des positions diff\xE9rentes.",skill:"D\xE9marrage",why:"En match, on d\xE9marre rarement bien plac\xE9 : de dos, de profil, en reculant.",durationMin:5,reps:"8 d\xE9parts de 6 m\xE8tres, 40 secondes de pause",equipment:["plots"],space:"moyen",parentRole:"joue",intensity:3,bodyAreas:v,recoverySec:40,safety:"\xC9chauffement avant. Jamais en fin de s\xE9ance ni un jour de fatigue.",steps:["Une ligne d'arriv\xE9e \xE0 6 m\xE8tres.","D\xE9part debout de face.","Puis de dos, de profil, en sautillant sur place.","Retour en marchant apr\xE8s chaque d\xE9part."],mk:["Premier pas trop grand.","Il se redresse tout de suite."],co:["\xAB Trois petits pas rapides pour partir. \xBB","\xAB Reste pench\xE9 en avant jusqu'\xE0 la moiti\xE9. \xBB"],easy:"D\xE9parts de face et de profil.",medium:"Quatre positions.",hard:"D\xE9part au signal visuel : votre main qui s'abaisse.",success:"Il d\xE9marre sans temps d'arr\xEAt dans les quatre positions.",diagram:{kind:"reaction",caption:"Trois petits pas pour partir"}},{slug:"chacun-son-ballon",name:"Chacun son ballon",category:"vitesse",age:[9,16],level:"intermediaire",difficulty:2,objective:"Sprinter sur 5 m\xE8tres pour atteindre son ballon avant le parent.",skill:"Vitesse sur courte distance",why:"Un petit duel donne envie de d\xE9marrer \xE0 fond. Chacun son couloir : aucun contact.",durationMin:5,reps:"6 duels, 45 secondes de pause",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:3,bodyAreas:v,recoverySec:45,safety:"Deux couloirs s\xE9par\xE9s de 3 m\xE8tres : aucun contact. \xC9chauffement avant.",steps:["Deux ballons (ou un ballon et un plot) pos\xE9s \xE0 5 m\xE8tres, un par couloir.","C\xF4te \xE0 c\xF4te sur la ligne de d\xE9part.","Au signal, chacun sprinte poser la semelle sur son ballon.","Donnez-vous un handicap : partez un pas derri\xE8re, ou \xE0 genoux."],mk:["Le parent gagne toujours.","Il ralentit avant le ballon."],co:["Ajustez votre handicap pour que ce soit serr\xE9.","\xAB Freine apr\xE8s le ballon, pas avant. \xBB"],easy:"Sur 4 m\xE8tres.",medium:"Sur 5 m\xE8tres.",hard:"Il doit ramener son ballon en conduite derri\xE8re la ligne de d\xE9part.",success:"Il d\xE9marre \xE0 fond sur les six duels.",diagram:{kind:"reaction",caption:"Chacun son couloir"}},{slug:"les-pieds-de-feu",name:"Les pieds de feu",category:"vitesse",age:[8,16],level:"debutant",difficulty:2,objective:"Encha\xEEner des appuis tr\xE8s rapides sur place pendant 5 secondes.",skill:"Fr\xE9quence d'appuis",why:"La vitesse commence par la capacit\xE9 \xE0 bouger les pieds tr\xE8s vite sur de tout petits efforts.",durationMin:4,reps:"6 fois 5 secondes, 30 secondes de pause",equipment:[],space:"petit",indoorOk:!0,parentRole:"joue",intensity:3,bodyAreas:v,steps:["Debout, genoux l\xE9g\xE8rement fl\xE9chis.","Au signal : petits pas sur place, le plus vite possible, pendant 5 secondes.","Stop, 30 secondes de repos complet.","Derni\xE8res r\xE9p\xE9titions : au signal \xAB go \xBB, il sprinte sur 3 m\xE8tres."],mk:["Grands mouvements lents.","Efforts trop longs."],co:["\xAB Tes pieds br\xFBlent : ils ne restent pas au sol. \xBB","Jamais plus de 5 secondes : la qualit\xE9 d'abord."],easy:"4 r\xE9p\xE9titions.",medium:"6 r\xE9p\xE9titions.",hard:"Les 5 secondes se terminent par un sprint de 3 m\xE8tres.",success:"Les appuis restent rapides et l\xE9gers jusqu'\xE0 la derni\xE8re r\xE9p\xE9tition.",diagram:{kind:"ladder",caption:"Le sol est br\xFBlant"}},{slug:"le-renard",name:"La queue du renard",category:"agilite",age:[5,10],level:"debutant",difficulty:1,objective:"Prot\xE9ger un foulard coinc\xE9 dans sa ceinture en esquivant.",skill:"Esquive",why:"Esquiver, feinter, changer d'appuis : toute l'agilit\xE9 du footballeur dans un jeu de cour d'\xE9cole.",durationMin:4,reps:"4 manches de 30 secondes, 30 secondes de pause",equipment:["plots"],space:"moyen",parentRole:"joue",intensity:3,bodyAreas:v,safety:k.duo,steps:["Coincez un foulard dans le dos de son short : c'est sa queue de renard.","D\xE9limitez une zone de 6 \xD7 6 m\xE8tres.","Vous essayez d'attraper la queue, il esquive.","Inversez les r\xF4les."],mk:["Il fuit en ligne droite.","Le parent attrape tout de suite."],co:["\xAB Change de direction quand j'approche. \xBB","Laissez-lui le temps de r\xE9ussir de belles esquives."],easy:"Le parent se d\xE9place en marchant.",medium:"Le parent trottine.",hard:"Chacun a une queue : on attaque et on d\xE9fend.",success:"Il garde sa queue 30 secondes au moins une fois.",diagram:{kind:"square",caption:"J'esquive, je change d'appui"}},{slug:"le-t",name:"Le parcours en T",category:"agilite",age:[10,18],level:"intermediaire",difficulty:3,objective:"Encha\xEEner course avant, pas chass\xE9s et course arri\xE8re sur un parcours en T.",skill:"Changements de direction",why:"Ce parcours r\xE9unit en quelques secondes tous les d\xE9placements d'un match.",durationMin:6,reps:"6 passages, 1 minute de pause",equipment:["plots"],space:"moyen",parentRole:"observe",intensity:3,bodyAreas:v,recoverySec:60,safety:"\xC9chauffement complet. Sol non glissant.",steps:["Quatre plots en T : 8 m\xE8tres de tige, 4 m\xE8tres de chaque c\xF4t\xE9.","Course avant jusqu'au plot central.","Pas chass\xE9s \xE0 gauche, puis \xE0 droite jusqu'au plot oppos\xE9, retour au centre.","Course arri\xE8re jusqu'au d\xE9part."],mk:["Il croise les pieds en pas chass\xE9s.","Il se retourne pour la course arri\xE8re."],co:["\xAB Les pieds ne se touchent jamais. \xBB","\xAB Garde les yeux devant, fais confiance \xE0 tes appuis. \xBB"],easy:"En trottinant, T r\xE9duit de moiti\xE9.",medium:"\xC0 allure soutenue.",hard:"D\xE9part au signal, c\xF4t\xE9 annonc\xE9 au dernier moment.",success:"4 passages propres sans toucher de plot.",diagram:{kind:"square",caption:"Avant, c\xF4t\xE9, c\xF4t\xE9, arri\xE8re"}},{slug:"les-ballons-qui-roulent",name:"Les ballons qui roulent",category:"agilite",age:[6,11],level:"debutant",difficulty:2,objective:"\xC9viter ou enjamber des ballons roul\xE9s par le parent.",skill:"Appuis et anticipation",why:"Lire une trajectoire et placer ses pieds au bon moment : de l'agilit\xE9 et de la perception.",durationMin:4,reps:"3 manches de 10 ballons",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["Il se place \xE0 5 m\xE8tres de vous.","Faites rouler un ballon vers ses pieds, doucement.","Il saute par-dessus ou l'\xE9vite d'un pas de c\xF4t\xE9.","Annoncez \xAB saute \xBB ou \xAB esquive \xBB pendant que le ballon roule."],mk:["Il saute trop t\xF4t.","Ballon lanc\xE9 trop fort."],co:["\xAB Attends que le ballon soit tout pr\xE8s. \xBB","Le ballon roule, il ne rebondit pas."],easy:"Il choisit : sauter ou esquiver.",medium:"Vous annoncez.",hard:"Apr\xE8s l'esquive, il se retourne et bloque le ballon de la semelle.",success:"8 ballons \xE9vit\xE9s sur 10.",diagram:{kind:"pair",caption:"Je lis, je saute"}},{slug:"la-navette",name:"La navette",category:"agilite",age:[9,16],level:"debutant",difficulty:2,objective:"Encha\xEEner des allers-retours courts avec freinage et relance.",skill:"Freiner et repartir",why:"Le football est fait de courses de quelques m\xE8tres : savoir freiner et repartir est essentiel.",durationMin:5,reps:"5 navettes, 1 minute de pause",equipment:["plots"],space:"moyen",parentRole:"observe",intensity:3,bodyAreas:v,recoverySec:60,safety:"\xC9chauffement avant. Sol non glissant. Jamais un jour de fatigue.",steps:["Trois plots align\xE9s, espac\xE9s de 4 m\xE8tres.","Il part du plot central, va toucher le plot de droite.","Il traverse jusqu'au plot de gauche, puis revient au centre.","Il touche chaque plot de la main en s'abaissant."],mk:["Il fait un demi-cercle au lieu de freiner.","Il reste debout pour toucher le plot."],co:["\xAB Pose ton pied ext\xE9rieur et repars. \xBB","\xAB Plie les jambes, pas le dos. \xBB"],easy:"Plots \xE0 3 m\xE8tres, en trottinant.",medium:"Plots \xE0 4 m\xE8tres.",hard:"Le parent annonce le premier c\xF4t\xE9 au d\xE9part.",success:"4 navettes avec un freinage net \xE0 chaque plot.",diagram:{kind:"slalom",n:3,caption:"Je freine, je touche, je repars"}},{slug:"passes-et-doigts",name:"Passes et doigts",category:"vision",age:[8,14],level:"intermediaire",difficulty:3,objective:"Annoncer le nombre de doigts lev\xE9s par le parent avant de recevoir.",skill:"Regarder avant de recevoir",why:"Prendre une information pendant que le ballon roule : c'est l'habitude qui change tout dans le jeu.",durationMin:5,reps:"2 s\xE9ries de 10 passes",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:1,bodyAreas:["pied"],steps:["\xC9changez des passes \xE0 6 m\xE8tres.","Juste apr\xE8s votre passe, levez des doigts d'une main.","Il annonce le nombre avant de toucher le ballon.","Puis il contr\xF4le et vous repasse."],mk:["Il annonce apr\xE8s avoir contr\xF4l\xE9.","Il rate son contr\xF4le en regardant."],co:["\xAB Le chiffre d'abord, le ballon ensuite. \xBB","Ralentissez vos passes pour lui laisser le temps."],easy:"Passes lentes, doigts lev\xE9s t\xF4t.",medium:"Passes normales.",hard:"Pair = contr\xF4le du droit, impair = contr\xF4le du gauche.",success:"8 annonces justes sur 10 avec un contr\xF4le propre.",diagram:{kind:"pair",caption:"Le chiffre d'abord, le ballon ensuite"}},{slug:"le-plot-qui-bouge",name:"Le plot qui a boug\xE9",category:"vision",age:[7,12],level:"debutant",difficulty:2,objective:"Rep\xE9rer ce qui a chang\xE9 dans son environnement.",skill:"Observation",why:"Photographier une situation d'un coup d'\u0153il, puis remarquer ce qui a chang\xE9 : le d\xE9but de la lecture du jeu.",durationMin:5,reps:"8 manches",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:1,bodyAreas:[],steps:["Disposez 5 objets autour d'une zone.","Il les regarde 5 secondes, puis conduit son ballon dos tourn\xE9.","Vous d\xE9placez ou retirez un objet.","Au signal, il se retourne et annonce ce qui a chang\xE9."],mk:["Il devine au hasard.","Il arr\xEAte de conduire son ballon."],co:["\xAB Fais une photo dans ta t\xEAte avant de tourner le dos. \xBB","Le ballon doit rester en mouvement."],easy:"3 objets, un seul retir\xE9.",medium:"5 objets, un d\xE9plac\xE9.",hard:"Deux changements \xE0 la fois.",success:"6 bonnes r\xE9ponses sur 8.",diagram:{kind:"square",caption:"Qu'est-ce qui a chang\xE9 ?"}},{slug:"deux-ballons",name:"Les deux ballons",category:"vision",age:[11,18],level:"confirme",difficulty:4,objective:"\xC9changer deux ballons en m\xEAme temps avec le parent.",skill:"Attention partag\xE9e",why:"G\xE9rer deux informations en m\xEAme temps entra\xEEne le cerveau \xE0 ne pas se fixer sur le seul ballon.",durationMin:5,reps:"4 s\xE9quences de 30 secondes",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:["pied"],steps:["Face \xE0 face, \xE0 5 m\xE8tres, un ballon chacun.","Au signal, vous passez tous les deux en m\xEAme temps, au sol.","Chacun contr\xF4le le ballon de l'autre et repasse.","Variante : un ballon au pied, l'autre lanc\xE9 \xE0 la main."],mk:["Passes qui se percutent.","Il fixe un seul ballon."],co:["Chacun passe l\xE9g\xE8rement sur sa droite.","\xAB Passe, puis l\xE8ve tout de suite les yeux. \xBB"],easy:"Un ballon au pied, un \xE0 la main.",medium:"Deux ballons au pied, deux touches.",hard:"Une touche.",success:"30 secondes d'\xE9changes sans arr\xEAt.",diagram:{kind:"pair",caption:"Je passe, je regarde l'autre ballon"}},{slug:"demarque-toi",name:"D\xE9marque-toi",category:"vision",age:[10,16],level:"intermediaire",difficulty:3,objective:"Se d\xE9placer du bon c\xF4t\xE9 d'un d\xE9fenseur pour recevoir le ballon.",skill:"Jeu sans ballon",why:"La plus grande partie d'un match se joue sans ballon : \xEAtre disponible s'apprend.",durationMin:6,reps:"2 s\xE9ries de 8",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["Un plot \xAB d\xE9fenseur \xBB \xE0 6 m\xE8tres de vous ; il se tient derri\xE8re.","Penchez-vous d'un c\xF4t\xE9 comme pour passer.","Il se d\xE9cale de l'autre c\xF4t\xE9 du plot pour \xEAtre visible.","Vous lui passez le ballon, il contr\xF4le vers l'avant."],mk:["Il reste cach\xE9 derri\xE8re le plot.","Il se d\xE9place trop t\xF4t."],co:["\xAB Si tu ne vois pas le ballon, je ne te vois pas non plus. \xBB","\xAB Bouge quand je l\xE8ve la t\xEAte. \xBB"],easy:"Vous annoncez le c\xF4t\xE9.",medium:"Il lit votre posture.",hard:"Un contre-appel : il part d'un c\xF4t\xE9 et revient de l'autre.",success:"6 ballons re\xE7us sur 8 en \xE9tant d\xE9marqu\xE9.",diagram:{kind:"gates",caption:"Je me montre du bon c\xF4t\xE9"}},{slug:"le-geste-du-jour",name:"Le geste du jour",category:"creativite",age:[8,18],level:"debutant",difficulty:3,objective:"Choisir et apprendre un geste technique qui lui fait envie.",skill:"Apprentissage autonome",why:"Travailler un geste qu'on a choisi soi-m\xEAme multiplie la motivation et la pers\xE9v\xE9rance.",durationMin:6,reps:"15 essais",equipment:["ballon"],space:"petit",parentRole:"observe",intensity:1,bodyAreas:v,steps:["Il choisit un geste qu'il a vu et qu'il aimerait r\xE9ussir.","Il le d\xE9compose en deux ou trois temps, au ralenti.","15 essais, sans commentaire de votre part.","Il vous montre son meilleur essai."],mk:["Il abandonne apr\xE8s cinq rat\xE9s.","Le parent corrige chaque essai."],co:["\xAB Il faut souvent cinquante essais : tu en es \xE0 cinq. \xBB","Demandez seulement : \xAB qu'est-ce qui a mieux march\xE9 ? \xBB"],easy:"Un geste d\xE9j\xE0 presque acquis.",medium:"Un geste nouveau.",hard:"Le placer ensuite dans un petit duel.",success:"Il est all\xE9 au bout des 15 essais.",diagram:{kind:"zigzag",n:2,caption:"Mon geste, mon rythme"}},{slug:"le-foot-golf",name:"Le foot-golf",category:"creativite",age:[6,18],level:"debutant",difficulty:2,objective:"Atteindre des cibles \xE9loign\xE9es en un minimum de touches.",skill:"Dosage et strat\xE9gie",why:"Le foot-golf fait travailler la pr\xE9cision et la r\xE9flexion, et se joue \xE0 tout \xE2ge, en famille.",durationMin:8,reps:"Un parcours de 4 \xE0 6 trous",equipment:["ballon","plots"],space:"grand",parentRole:"joue",intensity:1,bodyAreas:["pied","cheville"],steps:["Choisissez des \xAB trous \xBB : un arbre, un cerceau, un seau couch\xE9.","Chacun compte ses touches pour atteindre la cible.","Ajoutez des obstacles \xE0 contourner.","L'enfant dessine le trou suivant."],mk:["Il frappe fort \xE0 chaque coup.","Parcours trop long."],co:["\xAB O\xF9 veux-tu que le ballon s'arr\xEAte ? \xBB","Quatre trous suffisent."],easy:"Cibles larges et proches.",medium:"Parcours de 5 trous avec obstacles.",hard:"Un trou sur deux jou\xE9 du pied faible.",success:"Il termine le parcours et propose un trou de son invention.",diagram:{kind:"target",n:1,caption:"Le moins de touches possible"}},{slug:"le-tennis-ballon",name:"Le tennis-ballon",category:"creativite",age:[9,18],level:"intermediaire",difficulty:3,objective:"S'\xE9changer le ballon par-dessus une ligne ou une ficelle, avec un rebond.",skill:"Toucher et placement",why:"Un grand classique des footballeurs : toucher de balle, lecture des rebonds et bonne humeur.",durationMin:8,reps:"2 manches en 7 points",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:["pied","cheville","hanche"],steps:["Tendez une ficelle \xE0 50 cm du sol ou tracez une ligne.","Deux camps de 3 \xD7 4 m\xE8tres.","Un rebond autoris\xE9, trois touches maximum avant de renvoyer.","Service au pied, ballon l\xE2ch\xE9 des mains."],mk:["Il renvoie trop fort, hors du terrain.","Il attend le ballon au lieu de se placer."],co:["\xAB Renvoie haut et doucement. \xBB","\xAB Place-toi derri\xE8re le rebond. \xBB"],easy:"Deux rebonds autoris\xE9s, on peut rattraper \xE0 la main avant de renvoyer.",medium:"Un rebond, trois touches.",hard:"Un rebond, une touche.",success:"Un \xE9change de 4 renvois au moins une fois.",diagram:{kind:"pair",caption:"Haut et doucement"}},{slug:"le-commentateur",name:"Le commentateur",category:"creativite",age:[5,12],level:"debutant",difficulty:1,objective:"Jouer en commentant ses propres actions comme \xE0 la t\xE9l\xE9vision.",skill:"Imagination et expression",why:"Raconter son action \xE0 voix haute rend le jeu plus vivant et aide \xE0 prendre conscience de ses gestes.",durationMin:5,reps:"3 actions comment\xE9es",equipment:["ballon","but"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["Il imagine la fin d'un grand match.","Il part ballon au pied en commentant : \xAB il passe un joueur, il s'approche\u2026 \xBB.","Il conclut par un tir et la c\xE9l\xE9bration de son choix.","\xC0 votre tour : il commente votre action."],mk:["Il n'ose pas parler.","Le parent se moque."],co:["Commencez vous-m\xEAme, avec enthousiasme.","Jouez le jeu \xE0 fond : c'est s\xE9rieux, l'imagination."],easy:"Vous commentez, il joue.",medium:"Il joue et commente.",hard:"Il doit placer deux gestes annonc\xE9s \xE0 l'avance dans son action.",success:"Il a comment\xE9 au moins une action en entier.",diagram:{kind:"free",caption:"Et c'est le buuut !"}},{slug:"ma-routine",name:"Ma routine d'avant-match",category:"confiance",age:[9,18],level:"debutant",difficulty:1,objective:"Construire une petite routine personnelle pour se sentir pr\xEAt.",skill:"Pr\xE9paration mentale",why:"Une routine connue rassure : elle donne des rep\xE8res quand l'enjeu fait monter le stress.",durationMin:5,reps:"Une fois, puis avant chaque match",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:[],steps:["Il choisit trois \xE9l\xE9ments : un geste avec le ballon, une respiration, une phrase \xE0 se dire.","Il les encha\xEEne dans l'ordre, deux fois.","Vous notez sa routine dans l'album.","Il la refait avant le prochain entra\xEEnement pour l'essayer."],mk:["Routine trop longue.","Le parent choisit \xE0 sa place."],co:["Moins d'une minute en tout.","C'est sa routine : m\xEAme bizarre, elle est bonne."],easy:"Deux \xE9l\xE9ments.",medium:"Trois \xE9l\xE9ments.",hard:"Il ajoute un mot-cl\xE9 pour se relancer apr\xE8s une erreur.",success:"Il sait refaire sa routine seul.",diagram:{kind:"balance",caption:"Un geste, un souffle, une phrase"},metricKey:"confiance"},{slug:"le-film-dans-ma-tete",name:"Le film dans ma t\xEAte",category:"confiance",age:[8,18],level:"debutant",difficulty:1,objective:"S'imaginer en train de r\xE9ussir un geste avant de le faire.",skill:"Visualisation",why:"Se voir r\xE9ussir pr\xE9pare le corps au geste. Beaucoup de sportifs utilisent cette technique.",durationMin:4,reps:"5 essais",equipment:["ballon"],space:"petit",parentRole:"joue",intensity:1,bodyAreas:[],steps:["Il choisit un geste simple : une passe dans une porte, un tir sur une cible.","Yeux ferm\xE9s, il se voit le r\xE9ussir, avec le bruit du ballon.","Il ouvre les yeux et le fait.","Cinq fois de suite."],mk:["Il ferme les yeux une demi-seconde.","Il imagine un geste trop difficile."],co:["\xAB Raconte-moi ce que tu vois. \xBB","Un geste qu'il r\xE9ussit d\xE9j\xE0 une fois sur deux."],easy:"Vous d\xE9crivez le film \xE0 voix haute pour lui.",medium:"Il se fait son film seul.",hard:"Il ajoute au film une erreur, puis la fa\xE7on dont il se reprend.",success:"Il a pris le temps du film avant chacun des cinq essais.",diagram:{kind:"target",n:1,caption:"Je le vois, puis je le fais"},metricKey:"confiance"},{slug:"notre-rituel",name:"Notre rituel",category:"confiance",age:[4,10],level:"debutant",difficulty:1,objective:"Inventer un salut secret pour commencer et finir chaque s\xE9ance.",skill:"Lien et s\xE9curit\xE9 affective",why:"Un rituel partag\xE9 dit \xE0 l'enfant : ce moment est \xE0 nous. C'est un socle de confiance.",durationMin:3,reps:"Une fois, puis \xE0 chaque s\xE9ance",equipment:[],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:[],steps:["Inventez ensemble un salut en trois gestes : tape, coude, pied contre pied\u2026","Ajoutez un cri ou un mot secret.","R\xE9p\xE9tez-le trois fois pour le retenir.","Faites-le au d\xE9but et \xE0 la fin de chaque s\xE9ance."],mk:["Le parent trouve \xE7a ridicule.","Rituel trop compliqu\xE9."],co:["C'est exactement pour \xE7a que \xE7a marche.","Trois gestes, pas plus."],easy:"Vous proposez, il choisit.",medium:"Vous l'inventez \xE0 deux.",hard:"Il l'apprend \xE0 un autre membre de la famille.",success:"Vous savez tous les deux le refaire sans vous tromper.",diagram:{kind:"pair",caption:"Notre salut secret"},metricKey:"confiance"},{slug:"mon-objectif-du-jour",name:"Mon objectif du jour",category:"confiance",age:[7,18],level:"debutant",difficulty:1,objective:"Choisir un objectif simple, qui d\xE9pend uniquement de soi, pour la s\xE9ance.",skill:"Fixation d'objectif",why:"Un objectif qu'on contr\xF4le (\xAB oser le pied gauche \xBB) motive plus qu'un r\xE9sultat qu'on ne contr\xF4le pas (\xAB marquer \xBB).",durationMin:3,reps:"Une fois, en d\xE9but de s\xE9ance",equipment:[],space:"petit",indoorOk:!0,parentRole:"joue",intensity:1,bodyAreas:[],steps:["Demandez : \xAB qu'est-ce que tu veux essayer aujourd'hui ? \xBB","Aidez-le \xE0 le formuler comme une action : \xAB je vais\u2026 \xBB.","Il le dit \xE0 voix haute.","En fin de s\xE9ance : \xAB l'as-tu fait ? \xBB, sans jugement."],mk:["Objectif de r\xE9sultat : \xAB marquer 10 buts \xBB.","Le parent fixe l'objectif."],co:["\xAB Qu'est-ce que tu vas faire pour y arriver ? \xBB : c'est \xE7a, l'objectif.","Proposez deux id\xE9es, il choisit."],easy:"Il choisit parmi deux objectifs propos\xE9s.",medium:"Il formule son objectif.",hard:"Il choisit aussi comment il saura qu'il l'a tenu.",success:"Il a un objectif d'action et s'en souvient \xE0 la fin.",diagram:{kind:"pair",caption:"Aujourd'hui, je vais\u2026"},metricKey:"confiance"},{slug:"rate-souffle-suivant",name:"Rat\xE9, souffle, suivant",category:"confiance",age:[8,18],level:"debutant",difficulty:2,objective:"S'entra\xEEner \xE0 passer vite \xE0 l'action suivante apr\xE8s une erreur.",skill:"Gestion de l'erreur",why:"Tous les joueurs ratent. Ceux qui restent sereins ont appris \xE0 passer rapidement \xE0 la suite.",durationMin:5,reps:"10 frappes ou passes",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:1,bodyAreas:["pied"],steps:["Une cible assez difficile \xE0 8 m\xE8tres.","Apr\xE8s chaque essai rat\xE9 : une grande expiration.","Puis un petit geste \xE0 lui (taper dans ses mains) et le mot \xAB suivant \xBB.","F\xE9licitez la routine, pas le r\xE9sultat."],mk:["Il r\xE2le puis fait la routine sans y croire.","Le parent commente le rat\xE9."],co:["Faites la routine avec lui, \xE0 voix haute.","Votre seul mot : \xAB suivant \xBB."],easy:"Vous faites la routine ensemble.",medium:"Il la fait seul.",hard:"Dans un petit match, il l'utilise sans rappel.",success:"La routine est faite apr\xE8s chaque essai rat\xE9.",diagram:{kind:"target",n:1,caption:"Souffle \xB7 geste \xB7 suivant"},metricKey:"confiance"},{slug:"la-patate-chaude",name:"La patate chaude",category:"parent-enfant",age:[4,9],level:"debutant",difficulty:1,objective:"S'\xE9changer le ballon au pied le plus vite possible avant la fin du compte.",skill:"Passe rapide",why:"L'urgence amusante du jeu pousse \xE0 passer vite sans r\xE9fl\xE9chir au geste : il devient naturel.",durationMin:4,reps:"6 manches",equipment:["ballon"],space:"petit",indoorOk:!0,parentRole:"joue",intensity:2,bodyAreas:["pied"],steps:["Face \xE0 face, \xE0 3 m\xE8tres.","Le ballon est une patate chaude : on se le renvoie tout de suite.","Comptez \xE0 voix haute jusqu'\xE0 10 (ou mettez un minuteur cach\xE9).","Celui qui a la patate \xE0 la fin fait une grimace."],mk:["Il tape n'importe o\xF9.","Il arr\xEAte le ballon longtemps."],co:["\xAB Vite, mais dans mes pieds. \xBB","\xAB Elle br\xFBle ! Une touche ou deux. \xBB"],easy:"Deux touches autoris\xE9es.",medium:"Une touche si possible.",hard:"\xC0 trois, en triangle, avec un fr\xE8re ou une s\u0153ur.",success:"10 passes \xE9chang\xE9es avant la fin du compte.",diagram:{kind:"pair",caption:"Vite, elle br\xFBle !"},metricKey:"passes"},{slug:"suis-le-chef",name:"Suis le chef",category:"parent-enfant",age:[4,10],level:"debutant",difficulty:1,objective:"Imiter les d\xE9placements du chef, chacun avec son ballon.",skill:"Conduite et imitation",why:"Imiter oblige \xE0 lever la t\xEAte. Et \xEAtre le chef \xE0 son tour donne confiance.",durationMin:5,reps:"2 minutes chacun",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["Vous \xEAtes le chef : conduisez votre ballon en variant (lent, vite, arr\xEAt, demi-tour).","Il vous suit en faisant pareil.","Ajoutez des gestes rigolos : s'asseoir sur le ballon, tourner autour.","Changez de chef."],mk:["Le chef va trop vite.","Il regarde seulement son ballon."],co:["Retournez-vous souvent pour v\xE9rifier qu'il suit.","\xAB Regarde ce que je fais, pas ton ballon. \xBB"],easy:"En marchant, sans ballon pour le parent.",medium:"Chacun son ballon.",hard:"Il est le chef et doit inventer cinq gestes diff\xE9rents.",success:"Il a suivi, puis men\xE9 \xE0 son tour.",diagram:{kind:"free",caption:"Je fais comme le chef"}},{slug:"un-deux-trois-soleil",name:"Un, deux, trois, soleil",category:"parent-enfant",age:[4,9],level:"debutant",difficulty:1,objective:"Avancer ballon au pied et s'immobiliser quand le parent se retourne.",skill:"Arr\xEAt du ballon",why:"Le jeu pr\xE9f\xE9r\xE9 des cours de r\xE9cr\xE9ation, version ballon : on apprend \xE0 bloquer net.",durationMin:5,reps:"4 parties",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["Vous \xEAtes face \xE0 un mur ou un arbre, lui \xE0 10 m\xE8tres avec son ballon.","Dos tourn\xE9, dites \xAB un, deux, trois\u2026 soleil ! \xBB et retournez-vous.","Il doit \xEAtre immobile, pied sur le ballon.","S'il bouge ou si le ballon roule, il recule de trois pas."],mk:["Il avance trop vite et ne peut plus s'arr\xEAter.","Le ballon roule encore \xE0 l'arr\xEAt."],co:["\xAB De petites touches pour pouvoir t'arr\xEAter. \xBB","\xAB La semelle dessus d\xE8s que tu entends soleil. \xBB"],easy:"Vous comptez lentement.",medium:"Vous variez la vitesse.",hard:"Il doit s'arr\xEAter en \xE9quilibre sur un pied, l'autre sur le ballon.",success:"Il arrive jusqu'\xE0 vous sans \xEAtre renvoy\xE9 plus de deux fois.",diagram:{kind:"free",caption:"Soleil ! Semelle sur le ballon"}},{slug:"les-demenageurs",name:"Les d\xE9m\xE9nageurs",category:"parent-enfant",age:[4,8],level:"debutant",difficulty:1,objective:"Transporter des objets d'une maison \xE0 l'autre en conduisant son ballon.",skill:"Conduite avec un but",why:"Avec une mission \xE0 accomplir, l'enfant conduit son ballon sans y penser.",durationMin:5,reps:"2 d\xE9m\xE9nagements",equipment:["ballon","plots"],space:"moyen",parentRole:"joue",intensity:2,bodyAreas:v,steps:["Deux \xAB maisons \xBB \xE0 8 m\xE8tres. Dans la premi\xE8re : 5 petits objets.","Il prend un objet en main et l'emm\xE8ne dans l'autre maison, ballon au pied.","Il revient chercher le suivant.","Vous d\xE9m\xE9nagez dans l'autre sens : qui finit en premier ?"],mk:["Il prend le ballon dans les mains.","Il laisse le ballon pour courir."],co:["\xAB Le camion de d\xE9m\xE9nagement, c'est ton ballon. \xBB","\xAB Pas de livraison sans camion ! \xBB"],easy:"3 objets, maisons \xE0 5 m\xE8tres.",medium:"5 objets.",hard:"Un slalom de trois plots entre les deux maisons.",success:"Tous les objets d\xE9m\xE9nag\xE9s avec le ballon au pied.",diagram:{kind:"slalom",n:2,caption:"Livraison avec le ballon"}},{slug:"le-record-de-la-famille",name:"Le record de la famille",category:"parent-enfant",age:[8,18],level:"debutant",difficulty:2,objective:"\xC9tablir un record commun en additionnant les r\xE9ussites de chacun.",skill:"Coop\xE9ration",why:"On additionne au lieu de comparer : chacun apporte ce qu'il peut, et le record appartient \xE0 toute la famille.",durationMin:6,reps:"3 tentatives",equipment:["ballon"],space:"moyen",parentRole:"joue",intensity:1,bodyAreas:["pied"],steps:["Choisissez une \xE9preuve : jongles, passes dans une porte, tirs sur une cible.","Chacun fait son essai.","Additionnez les scores : c'est le record de la famille.","Notez-le dans l'album et essayez de le battre la semaine suivante."],mk:["On compare les scores individuels.","\xC9preuve trop difficile pour le plus jeune."],co:["Seul le total compte, on ne commente pas le reste.","Chacun a sa version de l'\xE9preuve, adapt\xE9e \xE0 son \xE2ge."],easy:"Une \xE9preuve, deux joueurs.",medium:"Deux \xE9preuves.",hard:"Toute la famille, avec un d\xE9fi diff\xE9rent par personne.",success:"Un record de famille est \xE9tabli et not\xE9.",diagram:{kind:"triangle",caption:"On additionne, on ne compare pas"}}].map(js);var Ls=18,As=e=>({...e,age:[e.age[0],e.age[1]>=17?Ls:e.age[1]]}),he=[...$e,..._e,...es].map(As),ss=["conduite","jonglage","controle","passes","precision","finition","dribbles"],M=(e,...a)=>a.includes(e.category),B=e=>e.equipment.includes("ballon"),Is=e=>[...new Set(e)],P=e=>a=>[Math.max(a.age[0],e),a.age[1]],E=(e,a=1)=>Math.min(5,e.difficulty+a),ye=[{key:"pied-faible",label:"pied faible",applies:e=>M(e,...ss)&&B(e),age:P(6),objective:e=>`Refaire \xAB ${e.name} \xBB en utilisant uniquement le pied le moins habile.`,why:"Un joueur \xE0 l'aise des deux pieds a deux fois plus de solutions. Le pied faible progresse vite quand on le fait travailler sur un exercice d\xE9j\xE0 connu.",steps:["Refaites ensuite tout l'exercice en n'utilisant que le pied faible.","Comptez \xE0 part les r\xE9ussi es:e=>M(e,"conduite","dribbles","controle","passes","coordination")&&B(e),age:P(7),objective:e=>`R\xE9aliser \xAB ${e.name} \xBB en regardant le parent plut\xF4t que le ballon.`,why:"Un joueur qui l\xE8ve la t\xEAte voit ses partenaires et le danger. On l'entra\xEEne en ajoutant une information \xE0 lire pendant le geste.",steps:["Placez-vous face \xE0 lui et montrez des doigts de la main pendant qu'il travaille.","Il annonce le nombre \xE0 voix haute sans s'arr\xEAter.","Changez de place pour l'obliger \xE0 vous chercher du regard."],mistake:"Il s'arr\xEAte pour regarder.",correction:"Ralentissez l'exercice : marcher est permis, s'arr\xEAter non.",easy:"Un signal toutes les cinq secondes, exercice au ralenti.",medium:"Un signal toutes les trois secondes.",hard:"Le signal indique aussi quoi faire : pair = continuer, impair = demi-tour.",success:"8 annonces justes sur 10 sans perdre le ballon.",caption:"Je regarde autour de moi",patch:e=>({difficulty:E(e),parentRole:"joue"})},{key:"conclusion",label:"avec conclusion",applies:e=>M(e,"conduite","dribbles","controle","coordination","agilite","vitesse"),age:P(7),objective:e=>`Encha\xEEner \xAB ${e.name} \xBB avec une passe ou un tir dans une porte.`,why:"En match, un geste n'est jamais isol\xE9 : il sert \xE0 pr\xE9parer le suivant. Terminer par une passe ou un tir donne un sens \xE0 l'exercice.",steps:["Installez une porte d'un m\xE8tre \xE0 5 ou 6 m\xE8tres de la fin de l'exercice.","D\xE8s qu'il a termin\xE9, il conclut par une passe au sol ou un tir dans la porte (donnez-lui un ballon \xE0 ce moment-l\xE0 s'il n'en a pas).","Il va chercher son ballon en marchant : c'est son temps de repos."],mistake:"Il s'arr\xEAte entre l'exercice et la conclusion.",correction:"\xAB La fin de l'exercice, c'est le ballon dans la porte. \xBB",easy:"Porte de 2 m\xE8tres, \xE0 4 m\xE8tres.",medium:"Porte d'un m\xE8tre, \xE0 6 m\xE8tres.",hard:"Deux portes : vous annoncez laquelle au dernier moment.",success:"Il encha\xEEne sans arr\xEAt n personnage ou un rebondissement \xE0 chaque passage."],mistake:"L'histoire prend toute la place et on ne joue plus.",correction:"Une phrase d'histoire, puis on joue : l'aventure avance \xE0 chaque passage.",easy:"Vous racontez, il joue.",medium:"Il choisit l'univers.",hard:"Il raconte lui-m\xEAme la suite pendant qu'il joue.",success:"Il r\xE9clame la suite de l'histoire.",caption:"Il \xE9tait une fois\u2026",patch:()=>({level:"debutant",parentRole:"joue"})},{key:"etoiles",label:"d\xE9fi 3 \xE9toiles",applies:()=>!0,age:P(6),objective:e=>`Transformer \xAB ${e.name} \xBB en d\xE9fi \xE0 trois paliers, contre soi-m\xEAme.`,why:"Trois paliers donnent une r\xE9ussite \xE0 chacun : la premi\xE8re \xE9toile r\xE9compense l'essai, la derni\xE8re la ma\xEEtrise.",steps:["Annoncez les paliers : une \xE9toile pour avoir fait l'exercice en entier.","Deux \xE9toiles s'il atteint le crit\xE8re de r\xE9ussite une fois.","Trois \xE9toiles s'il l'atteint deux fois de suite. Notez ses \xE9toiles dans l'application."],mistake:"Il ne pense qu'aux trois \xE9toiles et se crispe.",correction:"Rappelez que la premi\xE8re \xE9toile est d\xE9j\xE0 gagn\xE9e : le reste est du bonus.",easy:"Deux \xE9toiles suffisent aujourd'hui.",medium:"Les trois paliers.",hard:"Il fixe lui-m\xEAme un quatri\xE8me palier.",success:"Il gagne une \xE9toile de plus que la derni\xE8re fois, ou au moins la m\xEAme.",caption:"Une, deux, trois \xE9toiles"},{key:"duo",label:"\xE0 deux enfants",applies:()=>!0,age:P(5),objective:e=>`R\xE9aliser \xAB ${e.name} \xBB avec un fr\xE8re, une s\u0153ur ou un ami.`,why:"\xC0 deux, on s'encourage, on s'imite et on rit. C'est aussi la bonne formule pour des enfants d'\xE2ges diff\xE9rents.",steps:["Les deux enfants passent chacun leur tour ; celui qui attend encourage et compte.","Le plus jeune utilise la variante facile, le plus grand la variante difficile.","Terminez par un passage o\xF9 ils additionnent leurs r\xE9ussites : un score d'\xE9quipe."],mistake:"La comparaison s  la variante habituelle.",success:"Un passage propre, et l'envie d'y revenir.",caption:"Trois minutes, une consigne",patch:()=>({durationMin:3,reps:"2 \xE0 3 passages",intensity:1})},{key:"miroir",label:"en miroir avec le parent",applies:e=>{var a;return((a=e.parentRole)!=null?a:"observe")!=="joue"&&e.category!=="parent-enfant"},age:e=>e.age,objective:e=>`Faire \xAB ${e.name} \xBB c\xF4te \xE0 c\xF4te, en m\xEAme temps que le parent.`,why:"Un enfant apprend d'abord en imitant. Et vous voir essayer, r\xE9ussir ou rater change toute l'ambiance de la s\xE9ance.",steps:["Placez-vous \xE0 c\xF4t\xE9 de lui et faites l'exercice en m\xEAme temps.","Essayez de rester synchronis\xE9s : m\xEAme rythme, m\xEAmes gestes.","Laissez-le vous corriger : il adore \xE7a."],mistake:"Le parent va plus vite que l'enfant.",correction:"C'est lui qui donne le rythme, vous suivez.",easy:"Vous d\xE9marrez ensemble, chacun \xE0 son rythme.",medium:"Synchronis\xE9s sur un passage.",hard:"Synchronis\xE9s sur tout l'exercice.",success:"Un passage r\xE9alis\xE9 ensemble, au m\xEAme rythme.",caption:"Ensemble, au m\xEAme rythme",patch:()=>({parentRole:"joue"})},{key:"petit-espace",label:"version petit espace",applies:e=>{var a;return e.space!=="petit"&&((a=e.intensity)!=null?a:2)<=2&&!e.equipment.includes("but")&&!e.equipment.includes("mur")},age:e=>e.age,objective:e=>`Adapter \xAB ${e.name} \xBB \xE0 quelques m\xE8tres carr\xE9s.`,why:"Pas de jardin, il pleut, il fait nuit : l'exercice reste possible en r\xE9duisant les distances. Moins d'espace, c'est aussi plus de pr\xE9cision.",steps:["Divisez toutes les distances par deux, voire par trois.","\xC0 l'int\xE9rieur : ballon en mousse ou l\xE9g\xE8rement d\xE9gonfl\xE9, tout se joue au sol.","Ralentissez : dans un petit espace, on cherche la pr\xE9cision, pas la vitesse."],mistake:"Il joue \xE0 la m\xEAme vitesse que dehors.",correction:"\xAB Ici, c'est le plus pr\xE9cis qui gagne. \xBB",easy:"En marchant.",medium:"\xC0 allure tranquille.",hard:"D
