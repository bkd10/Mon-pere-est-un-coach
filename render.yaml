# Mise en ligne en un clic sur Render (render.com) : « New » → « Blueprint » → choisir ce dépôt.
# Région Francfort (Union européenne). Vérifier les formules et leurs prix au moment de la création.
services:
  - type: web
    name: premiers-pas-foot
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run release && npm start
    healthCheckPath: /mentions-legales
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: premiers-pas-foot-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: Premiers Pas Foot
      - key: FOUNDER_LINE
        value: Un projet porté par un professionnel du football diplômé.
      - key: GIFT_PRICE_CENTS
        value: "2900"
      # Éditeur de l'application (informations publiques des mentions légales) :
      - key: LEGAL_COMPANY
        value: "Bakary DOUMBIA EI, nom commercial BKD Management"
      - key: LEGAL_FORM
        value: "Entrepreneur individuel (EI)"
      - key: LEGAL_SIREN
        value: "844 587 618 R.C.S. Bobigny (SIRET du siège 844 587 618 00019)"
      - key: LEGAL_VAT
        value: "TVA non applicable, art. 293 B du CGI"
      - key: LEGAL_DIRECTOR
        value: "Bakary DOUMBIA"
      - key: LEGAL_HOST_NAME
        value: "Render Services, Inc."
      - key: LEGAL_HOST_ADDRESS
        value: "525 Brannan Street, Suite 300, San Francisco, CA 94107, États-Unis"
      - key: LEGAL_DATA_LOCATION
        value: "Union européenne (centre de données de Francfort, Allemagne)"
      - key: LEGAL_EMAIL
        value: "premierspasfoot@gmail.com"
      - key: LEGAL_HOST_PHONE
        value: "+1 415-319-8186"  # render.com/terms
      # À renseigner dans le tableau de bord Render (jamais dans le dépôt) :
      - { key: NEXT_PUBLIC_APP_URL, sync: false }   # ex. https://www.premierspasfoot.fr
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: SMTP_URL, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: LEGAL_ADDRESS, sync: false }
      - { key: LEGAL_PHONE, sync: false }
      - { key: LEGAL_MEDIATOR_NAME, sync: false }
      - { key: LEGAL_MEDIATOR_URL, sync: false }
  - type: cron
    name: premiers-pas-foot-quotidien
    runtime: node
    region: frankfurt
    schedule: "15 3 * * *"
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run daily
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: premiers-pas-foot-db, property: connectionString }
      - fromGroup: premiers-pas-foot-mail
databases:
  - name: premiers-pas-foot-db
    region: frankfurt
envVarGroups:
  - name: premiers-pas-foot-mail
    envVars:
      - { key: SMTP_URL, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: NEXT_PUBLIC_APP_URL, sync: false }
